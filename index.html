function sleep(ms) {
  return new Promise(resolve =>
    setTimeout(resolve, ms)
  );
}


function errorText(error) {

  if (!error) {
    return 'Невідома помилка';
  }

  return [
    error.message,
    error.details,
    error.hint,
    error.code
  ]
    .filter(Boolean)
    .join('\n');
}


function formatDate(date) {

  if (!date) {
    return '';
  }

  try {

    return new Date(date)
      .toLocaleDateString(
        'uk-UA'
      );

  } catch {

    return '';
  }
}

  async function secureAction(

  ) {

      Важливо:

      а НЕ initDataUnsafe.
    */

      );

    const {
      data,
      error

      await supabaseClient
        .functions
        .invoke(
          'marketplace-secure',
          {
            body: {
              initData:
                tg.initData,

    if (error) {

      );
    }


    if (data?.error) {

      throw new Error(
        data.error
      );
    }


    return data;
  }

  async function ensureDatabaseUser() {

    const {
      data: existing,
      error
    } =
      await supabaseClient
        .from('users')
        .select('*')
        .eq(
          'telegram_id',
          currentUser.id
        )
        .maybeSingle();


    if (error) {

      throw new Error(
        'Не вдалося прочитати користувача:\n' +
        errorText(error)
      );
    }


    if (existing) {

      const updates = {};

      if (
        currentUser.username &&
        currentUser.username !==
        existing.username
      ) {

        updates.username =
          currentUser.username;
      }


      if (
        currentUser.first_name &&
        currentUser.first_name !==
        existing.first_name
      ) {

        updates.first_name =
          currentUser.first_name;
      }


      if (
        currentUser.last_name &&
        currentUser.last_name !==
        existing.last_name
      ) {

        updates.last_name =
          currentUser.last_name;
      }


      if (
        currentUser.photo_url &&
        currentUser.photo_url !==
        existing.photo_url
      ) {

        updates.photo_url =
          currentUser.photo_url;
      }


      if (
        Object.keys(updates).length
      ) {

        const {
          data: updated,
          error: updateError
        } =
          await supabaseClient
            .from('users')
            .update(updates)
            .eq(
              'id',
              existing.id
            )
            .select('*')
            .maybeSingle();


        if (
          !updateError &&
          updated
        ) {

          return updated;
        }
      }


      return existing;
    }


    const {
      data: newUser,
      error: insertError
    } =
      await supabaseClient
        .from('users')
        .insert([
          {
            telegram_id:

    if (insertError) {

      throw new Error(
        'Не вдалося створити користувача:\n' +
        errorText(insertError)
      );
    }


    return newUser;
  }

  async function uploadNewImages() {

    const uploaded = [];


    for (
      const file of imageFiles
    ) {

      const extension =
        (
          file.name
            ?.split('.')
            .pop() ||
          'jpg'
        )
          .toLowerCase()
          .replace(
            /[^a-z0-9]/g,
            ''
          ) ||
        'jpg';


      const path =
        `${currentUser.id}/` +
        `${Date.now()}_` +
        `${Math.random()
          .toString(36)
          .slice(2)}.` +
        extension;


      const {
        error
      } =
        await supabaseClient
          .storage
          .from(
            'product-images'
          )
          .upload(
            path,
            file,
            {
              upsert: false
            }
          );


      if (error) {

        throw new Error(
          'Помилка фото:\n' +
          errorText(error)
        );
      }


      const {
        data
      } =
        supabaseClient
          .storage
          .from(
            'product-images'
          )
          .getPublicUrl(
            path
          );


      if (
        data?.publicUrl
      ) {

        uploaded.push(
          data.publicUrl
        );
      }
    }


    return uploaded;
  }

      prod.id

      prod.price_uah ?? ''

    setCondition(
      prod.condition ||
      'used'
    );

    setDescription(
      prod.description ||

  async function handleSaveProduct(
    event
  ) {

    event.preventDefault();


    if (!currentDbUser?.id) {

      alert(
        'Профіль не завантажений.'
      );

      return;
    }


    if (
      currentDbUser.is_banned
    ) {

      alert(
        'Ваш акаунт заблоковано.'
      );

      return;
    }


    if (!title.trim()) {

      alert(
        'Вкажіть назву.'
      );

      return;
    }


    if (!categoryId) {

      alert(
        'Оберіть категорію.'
      );

      return;
    }


    if (!region) {

      alert(
        'Оберіть область.'
      );

      return;
    }


    if (!city.trim()) {

      alert(
        'Вкажіть місто.'
      );

      return;
    }


    const parsedPrice =
      Number(price);


    if (
      !Number.isFinite(
        parsedPrice
      ) ||
      parsedPrice < 0
    ) {

      alert(
        'Вкажіть правильну ціну.'
      );

      return;
    }


    setIsSubmitting(
      true
    );


    try {

      const uploaded =
        await uploadNewImages();


      const finalImages =
        [
          ...existingImageUrls,
          ...uploaded
        ]
          .filter(Boolean)
          .slice(
            0,
            5
          );


      const payload = {

        title:
          title.trim(),

        price_uah:
          parsedPrice,

        condition,

        description:
          description.trim(),

        category_id:
          Number(
            categoryId
          ),

        region,

        city:
          city.trim(),

        image_url:
          finalImages[0] ||
          null
      };


      if (
        editingProductId
      ) {

        const {
          error
        } =
          await supabaseClient
            .from('products')
            .update({
              ...payload,

              moderation_status:
                'pending',

              moderation_reason:
                null,

              moderated_at:
                null
            })
            .eq(
              'id',
              editingProductId
            )
            .eq(
              'user_id',
              currentDbUser.id
            );


        if (error) {
          throw error;
        }


        const {
          error: deleteError
        } =
          await supabaseClient
            .from(
              'product_images'
            )
            .delete()
            .eq(
              'product_id',
              editingProductId
            );


        if (deleteError) {

          throw deleteError;
        }


        if (
          finalImages.length
        ) {

          const {
            error: galleryError
          } =
            await supabaseClient
              .from(
                'product_images'
              )
              .insert(
                finalImages.map(
                  imageUrl => ({
                    product_id:
                      editingProductId,

                    image_url:
                      imageUrl
                  })
                )
              );


          if (galleryError) {

            throw galleryError;
          }
        }


        alert(
          '✏️ Оголошення оновлено та відправлено на модерацію.'
        );

      } else {

        const expiresAt =
          new Date(
            Date.now() +
            30 *
            24 *
            60 *
            60 *
            1000
          )
            .toISOString();


        const {
          data: newProduct,
          error
        } =
          await supabaseClient
            .from('products')
            .insert([
              {
                ...payload,

                user_id:
                  currentDbUser.id,

                moderation_status:
                  'pending',

                expires_at:
                  expiresAt
              }
            ])
            .select('*')
            .single();


        if (error) {
          throw error;
        }


        if (
          finalImages.length
        ) {

          const {
            error: galleryError
          } =
            await supabaseClient
              .from(
                'product_images'
              )
              .insert(
                finalImages.map(
                  imageUrl => ({
                    product_id:
                      newProduct.id,

                    image_url:
                      imageUrl
                  })
                )
              );


          if (galleryError) {

            throw galleryError;
          }
        }


        alert(
          '🎉 Оголошення відправлено на модерацію.'
        );
      }


      resetForm();

      await fetchProducts();

      setTab(
        'profile'

    } catch (error) {

      alert(
        'Помилка:\n' +
        errorText(error)
      );

    } finally {

      setIsSubmitting(
        false
      );
    }
  }

  function isTop(
    prod
  ) {

    return Boolean(
      prod.boosted_until &&
      new Date(
        prod.boosted_until
      ) >
      new Date()
    );
  }


  async function waitForBoost(
    productId
  ) {

    for (
      let i = 0;
      i < 10;
      i++
    ) {

      const {
        data
      } =
        await supabaseClient
          .from('products')
          .select(
            'boosted_until'
          )
          .eq(
            'id',
            productId
          )
          .maybeSingle();


      if (
        data?.boosted_until &&
        new Date(
          data.boosted_until
        ) >
        new Date()
      ) {

        return true;
      }


      await sleep(
        1500
      );
    }


    return false;
  }


  async function boostProduct(
    prod
  ) {

    setBoostingProductId(
      prod.id
    );


    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .functions
          .invoke(
            'create-telegram-invoice',
            {
              body: {
                productId:
                  prod.id,

                telegramUserId:
                  currentUser.id
              }
            }
          );


      if (
        error ||
        !data?.invoiceLink
      ) {

        throw new Error(
          data?.error ||
          error?.message ||
          'Не вдалося створити рахунок.'
        );
      }


      tg?.openInvoice(
        data.invoiceLink,
        async status => {

          if (
            status ===
            'paid'
          ) {

            await waitForBoost(
              prod.id
            );

            await fetchProducts();

        }
      );

    } catch (error) {

      );

    } finally {

      setBoostingProductId(
        null
      );
    }
  }

  /* =========================================================
     HELPERS
  ========================================================= */

  function isExpired(
    prod
  ) {

    if (!prod.expires_at) {

      return false;
    }


    return (
      new Date(
        prod.expires_at
      ) <=
      new Date()
    );
  }


  function daysLeft(
    prod
  ) {

    if (!prod.expires_at) {

      return null;
    }


    const difference =
      new Date(
        prod.expires_at
      ) -
      new Date();


    return Math.max(
      0,
      Math.ceil(
        difference /
        (
          1000 *
          60 *
          60 *
          24
        )
      )
    );
  }


  function moderationLabel(
    status
  ) {

    if (
      status ===
      'approved'
    ) {

      return '✅ Схвалено';
    }


    if (
      status ===
      'rejected'
    ) {

      return '❌ Відхилено';
    }


    return '🕐 На модерації';
  }

     FILTERED PRODUCTS
  ========================================================= */

  const catalogProducts =
    products
      .filter(prod => {

        if (
          prod.is_sold
        ) {

          return false;
        }


        if (
          isExpired(prod)
        ) {

          return false;
        }


        if (
          prod.moderation_status !==
          'approved'
        ) {

          return false;
        }


        if (
          selectedCategory &&
          String(
            prod.category_id
          ) !==
          String(
            selectedCategory
          )
        ) {

          return false;
        }


        if (
          searchQuery &&
          !String(
            prod.title ||
            ''
          )
            .toLowerCase()
            .includes(
              searchQuery
                .toLowerCase()
            )
        ) {

          return false;
        }


        if (
          filterRegion &&
          prod.region !==
          filterRegion
        ) {

          return false;
        }


        if (
          filterCity &&
          !String(
            prod.city ||
            ''
          )
            .toLowerCase()
            .includes(
              filterCity
                .toLowerCase()
            )
        ) {

          return false;
        }


        if (
          minPrice &&
          Number(
            prod.price_uah
          ) <
          Number(
            minPrice
          )
        ) {

          return false;
        }


        if (
          maxPrice &&
          Number(
            prod.price_uah
          ) >
          Number(
            maxPrice
          )
        ) {

          return false;
        }


        if (
          conditionFilter !==
          'all' &&
          prod.condition !==
          conditionFilter
        ) {

          return false;
        }


        return true;
      })
      .sort(
        (a, b) => {

          const topA =
            isTop(a);

          const topB =
            isTop(b);


          if (
            topA !== topB
          ) {

            return topA
              ? -1
              : 1;

          if (
            sortOption ===
            'price_asc'
          ) {

            return (

              ) -

                b.price_uah
              )
            );
          }


          if (
            sortOption ===
            'price_desc'
          ) {

            return (
              Number(
                b.price_uah
              ) -
              Number(
                a.price_uah
              )
            );
          }


          return (
            new Date(
              b.created_at
            ) -
            new Date(
              a.created_at
            )
          );
        }
      );

              p-5
              w-full
              max-w-sm
            "
          >

            <h3
              className="
                text-lg
                font-black
              "
            >
              ⚠️ Поскаржитися
            </h3>


            <select
              value={
                reportReason
              }
              onChange={e =>
                setReportReason(
                  e.target.value
                )
              }
              className="
                w-full
                rounded-xl
                border
                p-3
                mt-4
              "
            >

              <option value="fraud">
                Шахрайство
              </option>

              <option value="spam">
                Спам
              </option>

              <option value="wrong_category">
                Неправильна категорія
              </option>

              <option value="prohibited">
                Заборонений товар
              </option>

              <option value="offensive">
                Образливий контент
              </option>

              <option value="other">
                Інше
              </option>

            </select>


            <textarea
              rows="4"
              value={
                reportDetails
              }
              onChange={e =>
                setReportDetails(
                  e.target.value
                )
              }
              placeholder="Опишіть проблему"
              className="
                w-full
                rounded-xl
                border
                p-3
                mt-3
              "
            />


            <div
              className="
                grid
                grid-cols-2
                gap-2
                mt-4
              "
            >

              <button
                type="button"
                onClick={() =>
                  setShowReportModal(
                    false
                  )
                }
                className="
                  bg-gray-200
                  rounded-xl
                  py-3
                  font-bold
                "
              >
                Скасувати
              </button>


              <button
                type="button"
                disabled={
                  sendingReport
                }
                onClick={
                  submitReport
                }
                className="
                  bg-red-600
                  text-white
                  rounded-xl
                  py-3
                  font-black
                  disabled:opacity-40
                "
              >
                Надіслати
              </button>

            </div>

          </div>

        </div>

      )}


      {/* NAV */}

      <nav
        className="
          fixed
          bottom-0
          left-0
          right-0
          max-w-md
          mx-auto
          bg-[#002f34]
          border-t
          border-[#104b50]
          flex
          justify-around
          py-3
          z-40
        "
      >

        <button
          type="button"
          onClick={() =>
            setTab(
              'catalog'
            )
          }
          className={
            `flex flex-col items-center text-[10px] font-bold ` +
            (
              tab === 'catalog'
                ? 'text-[#23e5bf]'
                : 'text-gray-400'
            )
          }
        >
          <span className="text-xl">
            🔍
          </span>
          Каталог
        </button>


        <button
          type="button"
          onClick={() =>
            setTab(
              'favorites'
            )
          }
          className={
            `flex flex-col items-center text-[10px] font-bold ` +
            (
              tab === 'favorites'
                ? 'text-[#23e5bf]'
                : 'text-gray-400'
            )
          }
        >
          <span className="text-xl">
            ❤️
          </span>
          Обране
        </button>


        <button
          type="button"
          onClick={() => {

            resetForm();

            setTab(
              'add'
            );

          }}
          className={
            `flex flex-col items-center text-[10px] font-bold ` +
            (
              tab === 'add'
                ? 'text-[#23e5bf]'
                : 'text-gray-400'
            )
          }
        >
          <span className="text-xl">
            ➕
          </span>
          Подати
        </button>


        <button
          type="button"
          onClick={() =>
            setTab(
              'profile'
            )
          }
          className={
            `flex flex-col items-center text-[10px] font-bold ` +
            (
              tab === 'profile'
                ? 'text-[#23e5bf]'
                : 'text-gray-400'
            )
          }
        >
          <span className="text-xl">
            👤
          </span>
          Профіль
        </button>


        {currentDbUser
          ?.is_admin && (

          <button
            type="button"
            onClick={() =>
              setTab(
                'admin'
              )
            }
            className={
              `flex flex-col items-center text-[10px] font-bold ` +
              (
                tab === 'admin'
                  ? 'text-[#23e5bf]'
                  : 'text-gray-400'
              )
            }
          >
            <span className="text-xl">
              🛡
            </span>
            Адмін
          </button>

        )}

      </nav>

    </div>
  );
}


/* =========================================================
   START REACT
========================================================= */

ReactDOM
  .createRoot(
    document.getElementById(
      'root'
    )
  )
  .render(
    <App />
  );

</script>

</body>
</html>
