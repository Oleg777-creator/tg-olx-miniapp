  return new Promise(

  );

function errorText(error) {
  if (!error) {
    return 'Невідома помилка';
  }

  return [
    error.message,
    error.details,
    error.hint,
    error.code
  ]
    .filter(Boolean)
    .join('\n');
}

  /* ========================================

  async function ensureDatabaseUser() {

    const {
      data: existingUser,
      error: selectError
    } =
      await supabaseClient
        .from('users')
        .select('*')
        .eq(
          'telegram_id',
          currentUser.id
        )
        .maybeSingle();


    if (selectError) {
      throw new Error(
        'Не вдалося прочитати користувача:\n' +
        errorText(selectError)
      );
    }


    if (existingUser?.id) {

      const updates = {};

      if (
        currentUser.username &&
        currentUser.username !==
        existingUser.username
      ) {
        updates.username =
          currentUser.username;
      }

      if (
        currentUser.first_name &&
        currentUser.first_name !==
        existingUser.first_name
      ) {
        updates.first_name =
          currentUser.first_name;
      }

      if (
        currentUser.last_name &&
        currentUser.last_name !==
        existingUser.last_name
      ) {
        updates.last_name =
          currentUser.last_name;
      }

      if (
        currentUser.photo_url &&
        currentUser.photo_url !==
        existingUser.photo_url
      ) {
        updates.photo_url =
          currentUser.photo_url;
      }


      if (
        Object.keys(updates).length
      ) {

        const {
          data: updatedUser
        } =
          await supabaseClient
            .from('users')
            .update(updates)
            .eq(
              'id',
              existingUser.id
            )
            .select('*')
            .maybeSingle();

        return (
          updatedUser ||
          existingUser
        );
      }


      return existingUser;
    }


    const newUserData = {

      telegram_id:
        currentUser.id,

      username:
        currentUser.username ||
        `user_${currentUser.id}`,

      first_name:
        currentUser.first_name ||
        'Користувач',

      last_name:
        currentUser.last_name ||
        null,

      photo_url:
        currentUser.photo_url ||
        null

    };


    const {
      data: newUser,
      error: insertError
    } =
      await supabaseClient
        .from('users')
        .insert([
          newUserData
        ])
        .select('*')
        .single();


    if (insertError) {
      throw new Error(
        'Не вдалося створити профіль:\n' +
        errorText(insertError)
      );
    }


    return newUser;
  }

  async function toggleFavorite(
    prod,
    event
  ) {

      return;
    }


    const exists =

      );

        error

          .from('favorites')

            'user_id',
            currentDbUser.id
          )

            'product_id',
            prod.id

      if (error) {

        alert(
          errorText(error)
        );

        return;
      }


      setFavoriteIds(
        prev =>
          prev.filter(
            id =>
              id !== prod.id
          )
      );

    } else {

      const {
        error
      } =
        await supabaseClient
          .from('favorites')
          .insert([
            {
              user_id:
                currentDbUser.id,

              product_id:
                prod.id
            }
          ]);


      if (error) {

        alert(
          errorText(error)

        return;
      }


      setFavoriteIds(
        prev => [
          ...prev,
          prod.id

  /* ========================================

  ======================================== */

  function handleFilesAdd(event) {

    const selected =
      Array.from(
        event.target.files ||
        []
      );


    const total =
      existingImageUrls.length +
      imageFiles.length +
      selected.length;


    if (total > 5) {

      alert(
        'Максимум 5 фото.'
      );

      event.target.value = '';

      return;
    }


    setImageFiles(
      prev => [
        ...prev,
        ...selected
      ]
    );


    setImagePreviews(
      prev => [
        ...prev,
        ...selected.map(
          file =>
            URL.createObjectURL(
              file
            )
        )
      ]
    );


    event.target.value = '';
  }


  function removeExistingImage(index) {

    setExistingImageUrls(
      prev =>
        prev.filter(
          (_, i) =>
            i !== index
        )
    );
  }


  function removeNewImage(index) {

    const src =
      imagePreviews[index];


    try {
      if (src) {
        URL.revokeObjectURL(
          src
        );
      }
    } catch {}


    setImageFiles(
      prev =>
        prev.filter(
          (_, i) =>
            i !== index
        )
    );


    setImagePreviews(
      prev =>
        prev.filter(
          (_, i) =>
            i !== index
        )
    );
  }


  async function uploadNewImages() {

    const uploaded = [];


    for (
      const file of imageFiles
    ) {

      const extension =
        (
          file.name
            ?.split('.')
            .pop() ||
          'jpg'
        )
          .toLowerCase()
          .replace(
            /[^a-z0-9]/g,
            ''
          ) ||
        'jpg';


      const path =
        `${currentUser.id}/` +
        `${Date.now()}_` +
        `${Math.random()
          .toString(36)
          .slice(2)}.` +
        extension;


      const {
        error
      } =
        await supabaseClient
          .storage
          .from(
            'product-images'
          )
          .upload(
            path,
            file,
            {
              upsert: false
            }
          );


      if (error) {

        throw new Error(
          'Помилка завантаження фото:\n' +
          errorText(error)
        );
      }


      const {
        data
      } =
        supabaseClient
          .storage
          .from(
            'product-images'
          )
          .getPublicUrl(
            path
          );


      if (
        data?.publicUrl
      ) {
        uploaded.push(
          data.publicUrl
        );
      }
    }


    return uploaded;
  }

  function resetForm() {

    imagePreviews.forEach(
      src => {
        try {
          URL.revokeObjectURL(
            src
          );
        } catch {}
      }
    );


    setEditingProductId(null);

    setTitle('');

    setPrice('');

    setCondition('used');

    setDescription('');

    setCategoryId('');

    setImageFiles([]);

    setImagePreviews([]);

    setExistingImageUrls([]);
  }


  function startEditing(prod) {

    let urls =
      (
        prod.product_images ||
        []
      )
        .map(
          item =>
            item.image_url
        )
        .filter(Boolean);


    if (
      urls.length === 0 &&
      prod.image_url
    ) {

      urls = [
        prod.image_url
      ];
    }


    setEditingProductId(
      prod.id
    );

    setTitle(
      prod.title || ''
    );

    setPrice(
      prod.price_uah ?? ''
    );

    setCondition(
      prod.condition ||
      'used'
    );

    setDescription(
      prod.description ||
      ''
    );

    setCategoryId(
      prod.category_id
        ? String(
            prod.category_id
          )
        : ''
    );

    setImageFiles([]);

    setImagePreviews([]);

    setExistingImageUrls(
      urls.slice(0, 5)
    );

    setTab('add');

  async function handleSaveProduct(
    event
  ) {

    event.preventDefault();


    if (!currentDbUser?.id) {

      alert(
        'Профіль ще не завантажено.'
      );

      return;
    }


    if (currentDbUser.is_banned) {

      alert(
        'Ваш акаунт заблоковано.'
      );

      return;
    }


    if (!title.trim()) {

      alert(
        'Вкажіть назву товару.'
      );

      return;
    }


    if (!categoryId) {

      alert(
        'Оберіть категорію.'
      );

      return;
    }


    const parsedPrice =
      Number(price);


    if (
      !Number.isFinite(
        parsedPrice
      ) ||
      parsedPrice < 0
    ) {

      alert(
        'Вкажіть правильну ціну.'
      );

      return;
    }


    setIsSubmitting(true);


    try {

      const uploaded =
        await uploadNewImages();


      const finalImages =
        [
          ...existingImageUrls,
          ...uploaded
        ]
          .filter(Boolean)
          .slice(0, 5);


      const mainImage =
        finalImages[0] ||
        null;


      const basePayload = {

        title:
          title.trim(),

        price_uah:
          parsedPrice,

        condition,

        description:
          description.trim(),

        category_id:
          Number(categoryId),

        image_url:
          mainImage

      };


      if (
        editingProductId
      ) {

        /*
          Після редагування повертаємо
          оголошення на модерацію.
        */

        const {
          error
        } =
          await supabaseClient
            .from('products')
            .update({
              ...basePayload,

              moderation_status:
                'pending',

              moderation_reason:
                null,

              moderated_at:
                null
            })
            .eq(
              'id',
              editingProductId
            )
            .eq(
              'user_id',
              currentDbUser.id
            );


        if (error) {
          throw error;
        }


        const {
          error: deleteGalleryError
        } =
          await supabaseClient
            .from('product_images')
            .delete()
            .eq(
              'product_id',
              editingProductId
            );


        if (
          deleteGalleryError
        ) {
          throw deleteGalleryError;
        }


        if (
          finalImages.length
        ) {

          const {
            error: galleryError
          } =
            await supabaseClient
              .from(
                'product_images'
              )
              .insert(
                finalImages.map(
                  url => ({
                    product_id:
                      editingProductId,

                    image_url:
                      url
                  })
                )
              );


          if (galleryError) {
            throw galleryError;
          }
        }


        alert(
          '✏️ Оголошення оновлено та відправлено на повторну модерацію.'
        );

      } else {

        const expires =
          new Date(
            Date.now() +
            30 *
            24 *
            60 *
            60 *
            1000
          ).toISOString();


        const {
          data: newProduct,
          error
        } =
          await supabaseClient
            .from('products')
            .insert([
              {
                ...basePayload,

                user_id:
                  currentDbUser.id,

                moderation_status:
                  'pending',

                expires_at:
                  expires
              }
            ])
            .select('*')
            .single();


        if (error) {
          throw error;
        }


        if (
          finalImages.length
        ) {

          const {
            error: galleryError
          } =
            await supabaseClient
              .from(
                'product_images'
              )
              .insert(
                finalImages.map(
                  url => ({
                    product_id:
                      newProduct.id,

                    image_url:
                      url
                  })
                )
              );


          if (galleryError) {
            throw galleryError;
          }
        }


        alert(
          '🎉 Оголошення створено та відправлено на модерацію.'
        );
      }


      resetForm();

      await fetchProducts();

      setTab('profile');


    } catch (error) {

      console.error(
        'SAVE',
        error
      );


      alert(
        'Помилка збереження:\n\n' +
        errorText(error)
      );

    } finally {

  /* ========================================

  ======================================== */

  function isTop(prod) {

    return Boolean(
      prod.boosted_until &&
      new Date(
        prod.boosted_until
      ) > new Date()
    );
  }


  async function waitForBoost(
    productId,
    attempts = 10
  ) {

    for (
      let i = 0;
      i < attempts;
      i++
    ) {

      const {
        data
      } =
        await supabaseClient
          .from('products')
          .select(
            'boosted_until'
          )
          .eq(
            'id',
            productId
          )
          .maybeSingle();


      if (
        data?.boosted_until &&
        new Date(
          data.boosted_until
        ) >
        new Date()
      ) {

        return true;
      }


      await sleep(1500);
    }


    return false;
  }


  async function boostProduct(
    prod
  ) {

    if (
      prod.is_sold ||
      isExpired(prod)
    ) {

      return;
    }


    setBoostingProductId(
      prod.id
    );


    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .functions
          .invoke(
            'create-telegram-invoice',
            {
              body: {
                productId:
                  prod.id,

                telegramUserId:
                  currentUser.id
              }
            }
          );


      if (
        error ||
        !data?.invoiceLink
      ) {

        throw new Error(
          data?.error ||
          error?.message ||
          'Не вдалося створити рахунок.'
        );
      }


      window.Telegram
        ?.WebApp
        ?.openInvoice(
          data.invoiceLink,
          async status => {

            if (
              status ===
              'paid'
            ) {

              const ok =
                await waitForBoost(
                  prod.id
                );


              await fetchProducts();


              alert(
                ok
                  ? '⭐ TOP активовано на 3 дні.'
                  : 'Оплата пройшла. TOP активується через кілька секунд.'
              );
            }
          }
        );


    } catch (error) {

      alert(
        'Помилка TOP:\n\n' +
        error?.message
      );

    } finally {

      setBoostingProductId(
        null
      );

    }
  }

  /* ========================================
     HELPERS
  ======================================== */

  function isExpired(prod) {

    if (!prod.expires_at) {
      return false;
    }


    return (
      new Date(
        prod.expires_at
      ) <=
      new Date()
    );
  }


  function daysLeft(prod) {

    if (!prod.expires_at) {
      return null;
    }


    const diff =
      new Date(
        prod.expires_at
      ) -
      new Date();


    return Math.max(
      0,
      Math.ceil(
        diff /
        (
          1000 *
          60 *
          60 *
          24
        )
      )
    );
  }


  function moderationLabel(
    status

    if (

  }


  /* ========================================
     FILTERS
  ======================================== */

  const catalogProducts =
    products
      .filter(prod => {

        if (
          prod.is_sold
        ) {
          return false;
        }


        if (
          isExpired(prod)
        ) {
          return false;
        }


        if (
          prod.moderation_status !==
          'approved'
        ) {
          return false;
        }


        const categoryMatch =
          selectedCategory
            ? String(
                prod.category_id
              ) ===
              String(
                selectedCategory
              )
            : true;


        const searchMatch =
          String(
            prod.title || ''
          )
            .toLowerCase()
            .includes(
              searchQuery
                .toLowerCase()
            );


        const minMatch =
          minPrice
            ? Number(
                prod.price_uah
              ) >=
              Number(
                minPrice
              )
            : true;


        const maxMatch =
          maxPrice
            ? Number(
                prod.price_uah
              ) <=
              Number(
                maxPrice
              )
            : true;


        const conditionMatch =
          conditionFilter ===
          'all'
            ? true
            : prod.condition ===
              conditionFilter;


        return (
          categoryMatch &&
          searchMatch &&
          minMatch &&
          maxMatch &&
          conditionMatch
        );
      })
      .sort((a, b) => {

        const topA =
          isTop(a);

        const topB =
          isTop(b);


        if (
          topA !== topB
        ) {
          return topA
            ? -1
            : 1;
        }


        if (
          sortOption ===
          'price_asc'
        ) {
          return (
            Number(
              a.price_uah
            ) -
            Number(
              b.price_uah
            )
          );
        }


        if (
          sortOption ===
          'price_desc'
        ) {
          return (
            Number(
              b.price_uah
            ) -
            Number(
              a.price_uah
            )
          );
        }


        return (
          new Date(
            b.created_at
          ) -
          new Date(
            a.created_at
          )
        );
      });

                      text-xs
                      text-gray-500
                      mt-1
                    "
                  >
                    👤 {
                      prod.users
                        ?.first_name ||
                      prod.users
                        ?.username ||
                      'User'
                    }
                  </div>


                  {prod.image_url && (

                    <img
                      src={
                        prod.image_url
                      }
                      className="
                        w-full
                        h-48
                        object-contain
                        bg-gray-100
                        rounded-lg
                        my-3
                      "
                    />

                  )}


                  <p
                    className="
                      text-xs
                      my-2
                    "
                  >
                    {
                      prod.description ||
                      'Без опису'
                    }
                  </p>


                  <div
                    className="
                      grid
                      grid-cols-2
                      gap-2
                    "
                  >

                    <button
                      type="button"
                      onClick={() =>
                        approveProduct(
                          prod
                        )
                      }
                      className="
                        bg-green-100
                        text-green-800
                        rounded-lg
                        py-2
                        font-black
                        text-xs
                      "
                    >
                      ✅ Схвалити
                    </button>


                    <button
                      type="button"
                      onClick={() =>
                        rejectProduct(
                          prod
                        )
                      }
                      className="
                        bg-red-100
                        text-red-700
                        rounded-lg
                        py-2
                        font-black
                        text-xs
                      "
                    >
                      ❌ Відхилити
                    </button>

                  </div>

                </div>

              ))}

            </div>

          )}


          {!adminLoading &&
            adminSection ===
              'reports' && (

            <div className="space-y-3">

              {adminReports.length ===
              0 ? (

                <div
                  className="
                    bg-[#00383e]
                    rounded-xl
                    p-6
                    text-center
                  "
                >
                  Відкритих скарг немає
                </div>

              ) : adminReports.map(
                report => (

                <div
                  key={
                    report.id
                  }
                  className="
                    bg-white
                    text-[#002f34]
                    rounded-xl
                    p-3
                  "
                >

                  <b>
                    ⚠️ Скарга #{report.id}
                  </b>

                  <p
                    className="
                      text-xs
                      mt-2
                    "
                  >
                    Товар ID: {
                      report.product_id
                    }
                  </p>

                  <p
                    className="
                      text-xs
                    "
                  >
                    Причина: {
                      report.reason
                    }
                  </p>


                  {report.details && (

                    <div
                      className="
                        bg-gray-100
                        rounded-lg
                        p-2
                        text-xs
                        my-2
                      "
                    >
                      {
                        report.details
                      }
                    </div>

                  )}


                  <div
                    className="
                      grid
                      grid-cols-2
                      gap-2
                    "
                  >

                    <button
                      type="button"
                      onClick={() =>
                        resolveReport(
                          report
                        )
                      }
                      className="
                        bg-green-100
                        text-green-700
                        rounded-lg
                        py-2
                        text-xs
                        font-bold
                      "
                    >
                      ✅ Закрити
                    </button>


                    <button
                      type="button"
                      onClick={() =>
                        rejectReportedProduct(
                          report
                        )
                      }
                      className="
                        bg-red-100
                        text-red-700
                        rounded-lg
                        py-2
                        text-xs
                        font-bold
                      "
                    >
                      🚫 Приховати товар
                    </button>

                  </div>

                </div>

              ))}

            </div>

          )}


          {!adminLoading &&
            adminSection ===
              'verification' && (

            <div className="space-y-3">

              {verificationUsers.length ===
              0 ? (

                <div
                  className="
                    bg-[#00383e]
                    rounded-xl
                    p-6
                    text-center
                  "
                >
                  Нових заявок немає
                </div>

              ) : verificationUsers.map(
                user => (

                <div
                  key={
                    user.id
                  }
                  className="
                    bg-white
                    text-[#002f34]
                    rounded-xl
                    p-3
                  "
                >

                  <b>
                    👤 {
                      user.first_name ||
                      'Користувач'
                    }
                  </b>


                  {user.username && (

                    <p
                      className="
                        text-xs
                        text-gray-500
                      "
                    >
                      @{user.username}
                    </p>

                  )}


                  <p
                    className="
                      text-xs
                      mt-1
                    "
                  >
                    Telegram ID: {
                      user.telegram_id
                    }
                  </p>


                  <div
                    className="
                      grid
                      grid-cols-2
                      gap-2
                      mt-3
                    "
                  >

                    <button
                      type="button"
                      onClick={() =>
                        approveVerification(
                          user
                        )
                      }
                      className="
                        bg-blue-100
                        text-blue-700
                        rounded-lg
                        py-2
                        text-xs
                        font-black
                      "
                    >
                      ✅ Верифікувати
                    </button>


                    <button
                      type="button"
                      onClick={() =>
                        rejectVerification(
                          user
                        )
                      }
                      className="
                        bg-red-100
                        text-red-700
                        rounded-lg
                        py-2
                        text-xs
                        font-black
                      "
                    >
                      ❌ Відхилити
                    </button>

                  </div>

                </div>

              ))}

            </div>

          )}

        </main>

      )}


      {/* PRODUCT MODAL */}

      {selectedProduct && (

        <div
          className="
            fixed
            inset-0
            bg-black/80
            z-50
            flex
            items-end
            justify-center
          "
        >

          <div
            className="
              bg-white
              text-[#002f34]
              w-full
              max-w-md
              max-h-[92vh]
              overflow-y-auto
              rounded-t-3xl
              p-5
              relative
            "
          >

            <button
              type="button"
              onClick={() =>
                setSelectedProduct(
                  null
                )
              }
              className="
                absolute
                top-4
                right-4
                z-20
                bg-gray-200
                w-9
                h-9
                rounded-full
                font-black
              "
            >
              ×
            </button>


            {selectedProduct
              .product_images
              ?.length ? (

              <div
                className="
                  flex
                  overflow-x-auto
                  no-scrollbar
                  snap-x
                  h-80
                  bg-gray-900
                  rounded-2xl
                  mb-4
                "
              >

                {selectedProduct
                  .product_images
                  .map(
                    (
                      image,
                      index
                    ) => (

                    <div
                      key={
                        index
                      }
                      className="
                        w-full
                        h-full
                        flex-shrink-0
                        snap-center
                        flex
                        items-center
                        justify-center
                      "
                    >

                      <img
                        src={
                          image.image_url
                        }
                        className="
                          max-w-full
                          max-h-full
                          object-contain
                        "
                      />

                    </div>

                  )
                )}

              </div>

            ) : selectedProduct
                .image_url ? (

              <div
                className="
                  h-80
                  bg-gray-900
                  rounded-2xl
                  flex
                  items-center
                  justify-center
                  mb-4
                "
              >

                <img
                  src={
                    selectedProduct
                      .image_url
                  }
                  className="
                    max-w-full
                    max-h-full
                    object-contain
                  "
                />

              </div>

            ) : null}


            {isTop(
              selectedProduct
            ) && (

              <span
                className="
                  inline-block
                  bg-amber-300
                  px-2
                  py-1
                  rounded
                  text-xs
                  font-black
                  mb-2
                "
              >
                ⭐ TOP
              </span>

            )}


            <h2
              className="
                text-xl
                font-black
              "
            >
              {
                selectedProduct.title
              }
            </h2>


            <div
              className="
                text-2xl
                font-black
                my-2
              "
            >
              {
                selectedProduct
                  .price_uah
              } ₴
            </div>


            <div
              className="
                bg-gray-100
                rounded-xl
                p-3
                mt-3
              "
            >

              <div
                className="
                  flex
                  items-center
                  gap-2
                "
              >

                <b>
                  👤 {
                    selectedProduct
                      .users
                      ?.first_name ||
                    selectedProduct
                      .users
                      ?.username ||
                    'Продавець'
                  }
                </b>


                {selectedProduct
                  .users
                  ?.is_verified && (

                  <span
                    className="
                      bg-blue-100
                      text-blue-700
                      text-[10px]
                      px-2
                      py-1
                      rounded
                      font-black
                    "
                  >
                    ✓ VERIFIED
                  </span>

                )}

              </div>


              <div
                className="
                  text-xs
                  text-amber-500
                  font-bold
                  mt-1
                "
              >
                ⭐ {
                  avgRating ||
                  'Немає рейтингу'
                }
              </div>

            </div>


            {selectedProduct
              .description && (

              <div
                className="
                  border-t
                  mt-4
                  pt-4
                "
              >

                <b
                  className="
                    text-xs
                    text-gray-500
                  "
                >
                  Опис
                </b>

                <p
                  className="
                    text-sm
                    mt-1
                    whitespace-pre-line
                  "
                >
                  {
                    selectedProduct
                      .description
                  }
                </p>

              </div>

            )}


            {
              selectedProduct
                .users?.id !==
              currentDbUser?.id && (

              <div
                className="
                  border-t
                  mt-4
                  pt-4
                "
              >

                <form
                  onSubmit={
                    handleAddReview
                  }
                  className="
                    bg-gray-100
                    rounded-xl
                    p-3
                    space-y-2
                  "
                >

                  <b className="text-xs">
                    Залишити відгук
                  </b>


                  <select
                    value={
                      newRating
                    }
                    onChange={e =>
                      setNewRating(
                        e.target.value
                      )
                    }
                    className="
                      w-full
                      p-2
                      rounded-lg
                    "
                  >

                    <option value="5">
                      ⭐⭐⭐⭐⭐
                    </option>

                    <option value="4">
                      ⭐⭐⭐⭐
                    </option>

                    <option value="3">
                      ⭐⭐⭐
                    </option>

                    <option value="2">
                      ⭐⭐
                    </option>

                    <option value="1">
                      ⭐
                    </option>

                  </select>


                  <input
                    type="text"
                    value={
                      newReviewComment
                    }
                    onChange={e =>
                      setNewReviewComment(
                        e.target.value
                      )
                    }
                    placeholder="Ваш відгук..."
                    className="
                      w-full
                      p-2
                      rounded-lg
                    "
                  />


                  <button
                    type="submit"
                    className="
                      w-full
                      bg-[#002f34]
                      text-white
                      rounded-lg
                      py-2
                      text-xs
                      font-bold
                    "
                  >
                    Надіслати
                  </button>

                </form>

              </div>

            )}


            <div
              className="
                flex
                gap-2
                mt-5
              "
            >

              <button
                type="button"
                onClick={() =>
                  openSellerChat(
                    selectedProduct
                      .users
                      ?.username
                  )
                }
                className="
                  flex-1
                  bg-[#002f34]
                  text-[#23e5bf]
                  rounded-xl
                  py-3
                  font-black
                "
              >
                💬 Написати
              </button>


              <button
                type="button"
                onClick={() =>
                  shareProduct(
                    selectedProduct
                  )
                }
                className="
                  bg-gray-100
                  rounded-xl
                  px-4
                "
              >
                🔗
              </button>

            </div>


            {
              selectedProduct
                .user_id !==
              currentDbUser?.id && (

              <button
                type="button"
                onClick={
                  openReportModal
                }
                className="
                  w-full
                  mt-3
                  bg-red-50
                  text-red-600
                  py-2
                  rounded-xl
                  text-xs
                  font-bold
                "
              >
                ⚠️ Поскаржитися
              </button>

            )}

          </div>

        </div>

      )}


      {/* REPORT MODAL */}

      {showReportModal && (

        <div
          className="
            fixed
            inset-0
            z-[60]
            bg-black/80
            flex
            items-center
            justify-center
            p-4
          "
        >

          <div
            className="
              bg-white
              text-[#002f34]
              rounded-2xl
              p-5
              w-full
              max-w-sm
            "
          >

            <h3
              className="
                font-black
                text-lg
              "
            >
              ⚠️ Скарга
            </h3>


            <select
              value={
                reportReason
              }
              onChange={e =>
                setReportReason(
                  e.target.value
                )
              }
              className="
                w-full
                p-3
                rounded-xl
                border
                mt-4
              "
            >

              <option value="fraud">
                Шахрайство
              </option>

              <option value="spam">
                Спам
              </option>

              <option value="wrong_category">
                Неправильна категорія
              </option>

              <option value="prohibited">
                Заборонений товар
              </option>

              <option value="offensive">
                Образливий контент
              </option>

              <option value="other">
                Інше
              </option>

            </select>


            <textarea
              value={
                reportDetails
              }
              onChange={e =>
                setReportDetails(
                  e.target.value
                )
              }
              rows="4"
              placeholder="Опишіть проблему..."
              className="
                w-full
                p-3
                rounded-xl
                border
                mt-3
              "
            />


            <div
              className="
                grid
                grid-cols-2
                gap-2
                mt-4
              "
            >

              <button
                type="button"
                onClick={() =>
                  setShowReportModal(
                    false
                  )
                }
                className="
                  bg-gray-200
                  rounded-xl
                  py-3
                  font-bold
                "
              >
                Скасувати
              </button>


              <button
                type="button"
                disabled={
                  sendingReport
                }
                onClick={
                  submitReport
                }
                className="
                  bg-red-600
                  text-white
                  rounded-xl
                  py-3
                  font-black
                  disabled:opacity-40
                "
              >
                {
                  sendingReport
                    ? '...'
                    : 'Надіслати'
                }
              </button>

            </div>

          </div>

        </div>

      )}


      {/* NAV */}

      <nav
        className="
          fixed
          bottom-0
          left-0
          right-0
          max-w-md
          mx-auto
          bg-[#002f34]
          border-t
          border-[#104b50]
          flex
          justify-around
          py-3
          z-40
        "
      >

        <button
          type="button"
          onClick={() =>
            setTab(
              'catalog'
            )
          }
          className={
            `flex flex-col items-center text-xs font-bold ` +
            (
              tab === 'catalog'
                ? 'text-[#23e5bf]'
                : 'text-gray-400'
            )
          }
        >
          <span className="text-xl">
            🔍
          </span>
          Каталог
        </button>


        <button
          type="button"
          onClick={() =>
            setTab(
              'favorites'
            )
          }
          className={
            `flex flex-col items-center text-xs font-bold ` +
            (
              tab === 'favorites'
                ? 'text-[#23e5bf]'
                : 'text-gray-400'
            )
          }
        >
          <span className="text-xl">
            ❤️
          </span>
          Обране
        </button>


        <button
          type="button"
          onClick={() => {
            resetForm();
            setTab('add');
          }}
          className={
            `flex flex-col items-center text-xs font-bold ` +
            (
              tab === 'add'
                ? 'text-[#23e5bf]'
                : 'text-gray-400'
            )
          }
        >
          <span className="text-xl">
            ➕
          </span>
          Подати
        </button>


        <button
          type="button"
          onClick={() =>
            setTab(
              'profile'
            )
          }
          className={
            `flex flex-col items-center text-xs font-bold ` +
            (
              tab === 'profile'
                ? 'text-[#23e5bf]'
                : 'text-gray-400'
            )
          }
        >
          <span className="text-xl">
            👤
          </span>
          Профіль
        </button>


        {currentDbUser
          ?.is_admin && (

          <button
            type="button"
            onClick={() =>
              setTab(
                'admin'
              )
            }
            className={
              `flex flex-col items-center text-[10px] font-bold ` +
              (
                tab === 'admin'
                  ? 'text-[#23e5bf]'
                  : 'text-gray-400'
              )
            }
          >
            <span className="text-xl">
              🛡
            </span>
            Адмін
          </button>

        )}

      </nav>

    </div>
  );
}


ReactDOM
  .createRoot(
    document.getElementById(
      'root'
    )
  )
  .render(
    <App />
  );

</script>

</body>
</html>
