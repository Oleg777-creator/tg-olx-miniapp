<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telegram OLX Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #002f34;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    input, textarea, select {
      color: #002f34 !important;
      -webkit-text-fill-color: #002f34 !important;
      background-color: #ffffff !important;
      opacity: 1 !important;
    }
    input::placeholder, textarea::placeholder {
      color: #64748b !important;
      -webkit-text-fill-color: #64748b !important;
    }
  </style>
</head>
<body class="pb-20">
  <div id="root"></div>

  <script type="text/babel">
    const SUPABASE_URL = 'https://dhjrvpnbeapybgomwelc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRoanJ2cG5iZWFweWJnb213ZWxjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMDk1NzMsImV4cCI6MjEwMzc4NTU3M30.-syhXj3B7AN-una0dIqCWZOk-wHaHfelBK_VdqduibY';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const tg = window.Telegram?.WebApp;

    function App() {
      const [products, setProducts] = React.useState([]);
      const [categories, setCategories] = React.useState([]);
      const [selectedCategory, setSelectedCategory] = React.useState(null);
      const [searchQuery, setSearchQuery] = React.useState('');
      const [sortOption, setSortOption] = React.useState('newest'); // 'newest', 'price_asc', 'price_desc'
      const [loading, setLoading] = React.useState(true);
      const [tab, setTab] = React.useState('catalog');

      const [selectedProduct, setSelectedProduct] = React.useState(null);

      const [title, setTitle] = React.useState('');
      const [price, setPrice] = React.useState('');
      const [description, setDescription] = React.useState('');
      const [categoryId, setCategoryId] = React.useState('');
      const [imageFiles, setImageFiles] = React.useState([]);
      const [imagePreviews, setImagePreviews] = React.useState([]);
      const [isSubmitting, setIsSubmitting] = React.useState(false);

      const currentUser = tg?.initDataUnsafe?.user || { id: 9999999, username: 'telegram_user', first_name: 'Користувач' };

      React.useEffect(() => {
        tg?.ready();
        tg?.expand();
        fetchCategories();
        fetchProducts();
      }, []);

      async function fetchCategories() {
        const { data } = await supabaseClient.from('categories').select('*');
        if (data) setCategories(data);
      }

      async function fetchProducts() {
        setLoading(true);
        let { data, error } = await supabaseClient
          .from('products')
          .select('*, categories(title), users!inner(telegram_id, username), product_images(image_url)')
          .order('created_at', { ascending: false });
        
        if (!error && data) setProducts(data);
        setLoading(false);
      }

      function handleFilesChange(e) {
        const files = Array.from(e.target.files);
        if (files.length > 5) {
          alert('Можна вибрати максимум 5 фотографій!');
          return;
        }
        setImageFiles(files);
        const previews = files.map(file => URL.createObjectURL(file));
        setImagePreviews(previews);
      }

      async function handleCreateProduct(e) {
        e.preventDefault();
        if (!title || !price) return alert('Будь ласка, вкажіть назву та ціну!');
        
        setIsSubmitting(true);

        try {
          let { data: dbUser } = await supabaseClient.from('users').select('id').eq('telegram_id', currentUser.id).maybeSingle();
          
          if (!dbUser) {
            const { data: newUser } = await supabaseClient.from('users').insert([{
              telegram_id: currentUser.id,
              username: currentUser.username || `user_${currentUser.id}`
            }]).select().single();
            dbUser = newUser;
          }

          let uploadedUrls = [];
          for (let file of imageFiles) {
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
            
            const { error: uploadErr } = await supabaseClient.storage
              .from('product-images')
              .upload(fileName, file);

            if (!uploadErr) {
              const { data: publicUrlData } = supabaseClient.storage
                .from('product-images')
                .getPublicUrl(fileName);
              uploadedUrls.push(publicUrlData.publicUrl);
            }
          }

          const mainImage = uploadedUrls.length > 0 ? uploadedUrls[0] : null;

          const { data: newProduct, error: prodErr } = await supabaseClient.from('products').insert([{
            user_id: dbUser.id,
            title,
            price_uah: parseFloat(price),
            description,
            category_id: categoryId ? parseInt(categoryId) : null,
            image_url: mainImage
          }]).select().single();

          if (prodErr) throw prodErr;

          if (uploadedUrls.length > 0 && newProduct) {
            const galleryData = uploadedUrls.map(url => ({
              product_id: newProduct.id,
              image_url: url
            }));
            await supabaseClient.from('product_images').insert(galleryData);
          }

          alert('🎉 Оголошення опубліковано!');
          setTitle(''); setPrice(''); setDescription(''); setCategoryId('');
          setImageFiles([]); setImagePreviews([]);
          setTab('catalog');
          fetchProducts();
        } catch (err) {
          alert('Помилка: ' + err.message);
        } finally {
          setIsSubmitting(false);
        }
      }

      async function handleDeleteProduct(id) {
        if (!confirm('Ви дійсно хочете видалити це оголошення?')) return;
        
        const { error } = await supabaseClient.from('products').delete().eq('id', id);
        if (!error) {
          alert('Оголошення успішно видалено!');
          fetchProducts();
        } else {
          alert('Помилка видалення: ' + error.message);
        }
      }

      function openSellerChat(username) {
        if (!username) return alert('У продавця немає юзернейму Telegram!');
        tg?.openTelegramLink(`https://t.me/${username}`);
      }

      function shareProduct(prod) {
        const text = `Подивіться товар: ${prod.title} за ${prod.price_uah} ₴ в OLX Mini App!`;
        tg?.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(text)}`);
      }

      // Фільтрація та сортування
      const filteredProducts = products.filter(prod => {
        const matchesCategory = selectedCategory ? prod.category_id === selectedCategory : true;
        const matchesSearch = prod.title.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      }).sort((a, b) => {
        if (sortOption === 'price_asc') return a.price_uah - b.price_uah;
        if (sortOption === 'price_desc') return b.price_uah - a.price_uah;
        return new Date(b.created_at) - new Date(a.created_at);
      });

      const myProducts = products.filter(p => p.users?.telegram_id === currentUser.id);

      return (
        <div class="max-w-md mx-auto min-h-screen flex flex-col justify-between bg-[#002f34] text-white">
          <div>
            {/* Header */}
            <header class="p-4 bg-[#002f34] flex justify-between items-center sticky top-0 z-10 border-b border-[#104b50]">
              <div class="flex items-center space-x-2">
                <span class="text-2xl font-black text-[#23e5bf]">OLX</span>
                <span class="text-xs bg-[#104b50] text-[#23e5bf] font-bold px-2 py-0.5 rounded">UA</span>
              </div>
              <span class="text-xs bg-[#104b50] text-gray-200 font-medium px-2.5 py-1 rounded-full border border-[#1b646a]">
                👤 {currentUser.first_name}
              </span>
            </header>

            {/* Catalog Tab */}
            {tab === 'catalog' && (
              <main class="p-4">
                {/* Search & Sort Input */}
                <div class="space-y-2 mb-3">
                  <input
                    type="text"
                    placeholder="🔍 Пошук оголошень..."
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    class="w-full border border-gray-300 rounded-xl p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-[#23e5bf]"
                  />
                  
                  <select
                    value={sortOption}
                    onChange={e => setSortOption(e.target.value)}
                    class="w-full border border-gray-300 rounded-xl p-2 text-xs focus:outline-none focus:ring-2 focus:ring-[#23e5bf]"
                  >
                    <option value="newest">⏱ Спочатку нові</option>
                    <option value="price_asc">📉 Від дешевших до дорожчих</option>
                    <option value="price_desc">📈 Від дорожчих до дешевших</option>
                  </select>
                </div>

                {/* Categories */}
                <div class="flex gap-2 overflow-x-auto pb-3 mb-3 no-scrollbar">
                  <button
                    onClick={() => setSelectedCategory(null)}
                    class={`px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all ${
                      selectedCategory === null ? 'bg-[#23e5bf] text-[#002f34]' : 'bg-[#00474e] text-white border border-[#104b50]'
                    }`}
                  >
                    Всі товари
                  </button>
                  {categories.map(cat => (
                    <button
                      key={cat.id}
                      onClick={() => setSelectedCategory(selectedCategory === cat.id ? null : cat.id)}
                      class={`px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all ${
                        selectedCategory === cat.id ? 'bg-[#23e5bf] text-[#002f34]' : 'bg-[#00474e] text-white border border-[#104b50]'
                      }`}
                    >
                      {cat.title}
                    </button>
                  ))}
                </div>

                {/* Grid Products */}
                {loading ? (
                  <div class="text-center py-16 text-[#23e5bf] font-medium">Завантаження...</div>
                ) : filteredProducts.length === 0 ? (
                  <div class="text-center py-16 text-gray-300 bg-[#00383e] rounded-2xl border border-[#104b50] p-6">
                    <p class="text-3xl mb-2">📦</p>
                    <p class="font-bold text-white">Оголошень не знайдено</p>
                  </div>
                ) : (
                  <div class="grid grid-cols-2 gap-3">
                    {filteredProducts.map(prod => (
                      <div
                        key={prod.id}
                        onClick={() => setSelectedProduct(prod)}
                        class="bg-white rounded-xl overflow-hidden flex flex-col justify-between p-2.5 text-[#002f34] shadow-md cursor-pointer active:scale-[0.98] transition"
                      >
                        <div>
                          {prod.image_url ? (
                            <div class="w-full h-44 bg-gray-50 rounded-lg mb-2 flex items-center justify-center overflow-hidden">
                              <img src={prod.image_url} alt={prod.title} class="max-h-full max-w-full object-contain" />
                            </div>
                          ) : (
                            <div class="w-full h-44 bg-gray-100 rounded-lg mb-2 flex items-center justify-center text-gray-400 text-2xl">
                              🖼️
                            </div>
                          )}
                          <span class="text-[9px] uppercase font-black text-[#002f34] bg-[#23e5bf] px-1.5 py-0.5 rounded">
                            {prod.categories?.title || 'Товар'}
                          </span>
                          <h3 class="font-bold text-xs text-[#002f34] line-clamp-2 mt-1 leading-snug">{prod.title}</h3>
                        </div>
                        <div class="mt-2 pt-2 border-t border-gray-100 flex justify-between items-center">
                          <span class="text-sm font-black text-[#002f34]">{prod.price_uah} ₴</span>
                          <span class="text-xs text-blue-600 font-bold">➔</span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </main>
            )}

            {/* Add Tab */}
            {tab === 'add' && (
              <main class="p-4">
                <div class="bg-[#00383e] p-5 rounded-2xl border border-[#104b50] shadow-lg">
                  <h2 class="text-lg font-black text-white mb-4 flex items-center gap-2">
                    <span class="text-[#23e5bf]">➕</span> Нове оголошення
                  </h2>
                  <form onSubmit={handleCreateProduct} class="space-y-4">
                    <div>
                      <label class="block text-xs font-bold text-gray-200 mb-1">Назва товару *</label>
                      <input
                        type="text"
                        required
                        placeholder="напр. Кросівки Nike Air Max"
                        value={title}
                        onChange={e => setTitle(e.target.value)}
                        class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#23e5bf]"
                      />
                    </div>
                    <div>
                      <label class="block text-xs font-bold text-gray-200 mb-1">Ціна (₴) *</label>
                      <input
                        type="number"
                        required
                        step="0.01"
                        placeholder="0.00"
                        value={price}
                        onChange={e => setPrice(e.target.value)}
                        class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#23e5bf]"
                      />
                    </div>
                    <div>
                      <label class="block text-xs font-bold text-gray-200 mb-1">Фото товару (до 5 шт.)</label>
                      <input
                        type="file"
                        accept="image/*"
                        multiple
                        onChange={handleFilesChange}
                        class="w-full text-xs text-gray-300 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-[#23e5bf] file:text-[#002f34]"
                      />
                      {imagePreviews.length > 0 && (
                        <div class="flex gap-2 overflow-x-auto mt-2 no-scrollbar">
                          {imagePreviews.map((src, i) => (
                            <img key={i} src={src} class="w-20 h-28 object-contain bg-black/20 rounded-lg border border-[#104b50]" />
                          ))}
                        </div>
                      )}
                    </div>
                    <div>
                      <label class="block text-xs font-bold text-gray-200 mb-1">Категорія</label>
                      <select
                        value={categoryId}
                        onChange={e => setCategoryId(e.target.value)}
                        class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#23e5bf]"
                      >
                        <option value="">Оберіть категорію</option>
                        {categories.map(cat => (
                          <option key={cat.id} value={cat.id}>{cat.title}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label class="block text-xs font-bold text-gray-200 mb-1">Опис</label>
                      <textarea
                        rows="3"
                        placeholder="Детальний опис товару..."
                        value={description}
                        onChange={e => setDescription(e.target.value)}
                        class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#23e5bf]"
                      ></textarea>
                    </div>
                    <button
                      type="submit"
                      disabled={isSubmitting}
                      class="w-full bg-[#23e5bf] text-[#002f34] font-black py-3 rounded-xl shadow-md hover:bg-[#1fd6b2] active:scale-[0.99] transition disabled:opacity-50"
                    >
                      {isSubmitting ? 'Завантаження...' : 'Опублікувати оголошення'}
                    </button>
                  </form>
                </div>
              </main>
            )}

            {/* Profile Tab */}
            {tab === 'profile' && (
              <main class="p-4">
                <div class="bg-[#00383e] p-4 rounded-2xl border border-[#104b50] mb-4">
                  <h2 class="text-base font-bold text-white flex items-center gap-2">
                    <span>👤</span> Особистий кабінет
                  </h2>
                  <p class="text-xs text-gray-300 mt-1">Всього у вас оголошень: <b>{myProducts.length}</b></p>
                </div>

                <h3 class="text-xs uppercase font-bold text-gray-400 mb-2">Ваші публікації:</h3>

                {myProducts.length === 0 ? (
                  <div class="text-center py-8 text-gray-400 bg-[#00383e] rounded-xl border border-dashed border-[#104b50] p-4">
                    <p class="text-sm">Ви ще не опублікували жодного товару</p>
                  </div>
                ) : (
                  <div class="space-y-3">
                    {myProducts.map(prod => (
                      <div key={prod.id} class="bg-white p-3 rounded-xl text-[#002f34] flex gap-3 items-center justify-between shadow-sm">
                        <div class="flex gap-3 items-center overflow-hidden">
                          {prod.image_url ? (
                            <img src={prod.image_url} alt={prod.title} class="w-14 h-14 object-cover rounded-lg flex-shrink-0" />
                          ) : (
                            <div class="w-14 h-14 bg-gray-100 rounded-lg flex items-center justify-center text-xl flex-shrink-0">🖼️</div>
                          )}
                          <div class="truncate">
                            <h4 class="font-bold text-xs truncate">{prod.title}</h4>
                            <p class="text-xs font-black text-[#002f34] mt-0.5">{prod.price_uah} ₴</p>
                          </div>
                        </div>
                        <button
                          onClick={() => handleDeleteProduct(prod.id)}
                          class="bg-red-50 text-red-600 p-2.5 rounded-lg text-sm font-bold active:scale-95 transition"
                          title="Видалити"
                        >
                          🗑️
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </main>
            )}
          </div>

          {/* Modal / Detailed View with Full-Size Carousel */}
          {selectedProduct && (
            <div class="fixed inset-0 bg-black/80 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div class="bg-white text-[#002f34] w-full max-w-md rounded-t-3xl sm:rounded-2xl max-h-[90vh] overflow-y-auto p-5 relative">
                <button
                  onClick={() => setSelectedProduct(null)}
                  class="absolute top-4 right-4 bg-gray-200 text-gray-700 w-8 h-8 rounded-full font-bold text-sm flex items-center justify-center z-10"
                >
                  ✕
                </button>

                {/* Horizontal Swipe Gallery with Full Height Images */}
                <div class="w-full mb-4">
                  {selectedProduct.product_images && selectedProduct.product_images.length > 0 ? (
                    <div class="flex gap-2 overflow-x-auto snap-x snap-mandatory no-scrollbar rounded-2xl bg-gray-900 h-80">
                      {selectedProduct.product_images.map((img, idx) => (
                        <div key={idx} class="snap-center flex-shrink-0 w-full h-full flex items-center justify-center bg-gray-900">
                          <img src={img.image_url} class="max-h-full max-w-full object-contain" />
                        </div>
                      ))}
                    </div>
                  ) : selectedProduct.image_url ? (
                    <div class="w-full h-80 bg-gray-900 rounded-2xl flex items-center justify-center">
                      <img src={selectedProduct.image_url} class="max-h-full max-w-full object-contain rounded-2xl" />
                    </div>
                  ) : (
                    <div class="w-full h-44 bg-gray-100 rounded-2xl flex items-center justify-center text-gray-400 text-4xl">
                      🖼️
                    </div>
                  )}
                  {selectedProduct.product_images && selectedProduct.product_images.length > 1 && (
                    <p class="text-[10px] text-gray-400 text-center mt-1 font-bold">👉 Гортайте вбік щоб побачити всі фото</p>
                  )}
                </div>

                <span class="text-xs uppercase font-black text-[#002f34] bg-[#23e5bf] px-2 py-0.5 rounded-md">
                  {selectedProduct.categories?.title || 'Товар'}
                </span>

                <h2 class="text-xl font-black mt-2 leading-tight">{selectedProduct.title}</h2>
                <div class="text-2xl font-black text-[#002f34] my-2">{selectedProduct.price_uah} ₴</div>

                {selectedProduct.description && (
                  <div class="my-4 border-t pt-3 border-gray-100">
                    <h4 class="text-xs font-bold text-gray-500 uppercase mb-1">Опис:</h4>
                    <p class="text-xs text-gray-700 whitespace-pre-line leading-relaxed">{selectedProduct.description}</p>
                  </div>
                )}

                <div class="flex gap-2 mt-5">
                  <button
                    onClick={() => openSellerChat(selectedProduct.users?.username)}
                    class="flex-1 bg-[#002f34] text-[#23e5bf] font-black py-3 rounded-xl flex items-center justify-center gap-2 active:scale-95 transition"
                  >
                    <span>💬</span> Написати продавцю
                  </button>
                  <button
                    onClick={() => shareProduct(selectedProduct)}
                    class="bg-gray-100 text-gray-700 px-4 py-3 rounded-xl font-bold active:scale-95 transition"
                  >
                    🔗
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Bottom Nav */}
          <nav class="fixed bottom-0 left-0 right-0 bg-[#002f34] border-t border-[#104b50] flex justify-around py-2.5 max-w-md mx-auto z-20 shadow-lg">
            <button
              onClick={() => setTab('catalog')}
              class={`flex flex-col items-center text-xs font-bold transition ${tab === 'catalog' ? 'text-[#23e5bf]' : 'text-gray-400'}`}
            >
              <span class="text-base mb-0.5">🔍</span>
              <span>Каталог</span>
            </button>
            <button
              onClick={() => setTab('add')}
              class={`flex flex-col items-center text-xs font-bold transition ${tab === 'add' ? 'text-[#23e5bf]' : 'text-gray-400'}`}
            >
              <span class="text-base mb-0.5">➕</span>
              <span>Подати</span>
            </button>
            <button
              onClick={() => setTab('profile')}
              class={`flex flex-col items-center text-xs font-bold transition ${tab === 'profile' ? 'text-[#23e5bf]' : 'text-gray-400'}`}
            >
              <span class="text-base mb-0.5">👤</span>
              <span>Профіль</span>
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
