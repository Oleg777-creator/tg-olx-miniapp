<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telegram OLX Mini App</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background-color: #002f34;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    input,
    textarea,
    select {
      color: #002f34 !important;
      -webkit-text-fill-color: #002f34 !important;
      background-color: #ffffff !important;
      opacity: 1 !important;
    }

    input::placeholder,
    textarea::placeholder {
      color: #64748b !important;
      -webkit-text-fill-color: #64748b !important;
    }
  </style>
</head>

<body class="pb-20">

  <div id="root"></div>

  <script type="text/babel">

    const SUPABASE_URL = 'https://dhjrvpnbeapybgomwelc.supabase.co';

    const SUPABASE_ANON_KEY =
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJkaHJ2cG5iZWFweWJnb213ZWxjIiwicmVmIjoiZGhqcnZwbmJlYXB5YmdvbXdlbGMiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4ODIwOTU3MywiZXhwIjoyMTAzNzg1NTczfQ.-syhXj3B7AN-una0dIqCWZOk-wHaHfelBK_VdqduibY';

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const tg = window.Telegram?.WebApp;


    function App() {

      const [products, setProducts] = React.useState([]);
      const [categories, setCategories] = React.useState([]);
      const [selectedCategory, setSelectedCategory] = React.useState(null);

      // Фільтри
      const [searchQuery, setSearchQuery] = React.useState('');
      const [minPrice, setMinPrice] = React.useState('');
      const [maxPrice, setMaxPrice] = React.useState('');
      const [conditionFilter, setConditionFilter] = React.useState('all');
      const [sortOption, setSortOption] = React.useState('newest');
      const [showFilters, setShowFilters] = React.useState(false);

      const [loading, setLoading] = React.useState(true);
      const [tab, setTab] = React.useState('catalog');
      const [favoriteIds, setFavoriteIds] = React.useState([]);
      const [selectedProduct, setSelectedProduct] = React.useState(null);

      // Форма створення / редагування
      const [editingProductId, setEditingProductId] = React.useState(null);
      const [title, setTitle] = React.useState('');
      const [price, setPrice] = React.useState('');
      const [condition, setCondition] = React.useState('used');
      const [description, setDescription] = React.useState('');
      const [categoryId, setCategoryId] = React.useState('');
      const [imageFiles, setImageFiles] = React.useState([]);
      const [imagePreviews, setImagePreviews] = React.useState([]);
      const [isSubmitting, setIsSubmitting] = React.useState(false);
      const [currentDbUser, setCurrentDbUser] = React.useState(null);

      // Відгуки
      const [sellerReviews, setSellerReviews] = React.useState([]);
      const [newRating, setNewRating] = React.useState(5);
      const [newReviewComment, setNewReviewComment] = React.useState('');

      // Стан оплати бусту
      const [boostingProductId, setBoostingProductId] = React.useState(null);


      const currentUser =
        tg?.initDataUnsafe?.user || {
          id: 9999999,
          username: 'telegram_user',
          first_name: 'Користувач'
        };


      React.useEffect(() => {
        tg?.ready();
        tg?.expand();

        initUserAndData();
      }, []);


      async function initUserAndData() {

        fetchCategories();

        let { data: dbUser } = await supabaseClient
          .from('users')
          .select('*')
          .eq('telegram_id', currentUser.id)
          .maybeSingle();

        if (!dbUser) {

          const { data: newUser } = await supabaseClient
            .from('users')
            .insert([{
              telegram_id: currentUser.id,
              username:
                currentUser.username ||
                `user_${currentUser.id}`
            }])
            .select()
            .single();

          dbUser = newUser;
        }

        setCurrentDbUser(dbUser);

        if (dbUser) {
          fetchFavorites(dbUser.id);
        }

        fetchProducts();
      }


      async function fetchCategories() {

        const { data } = await supabaseClient
          .from('categories')
          .select('*')
          .order('id', { ascending: true });

        if (data) {
          setCategories(data);
        }
      }


      async function fetchProducts() {

        setLoading(true);

        const { data, error } = await supabaseClient
          .from('products')
          .select(
            '*, categories(title), users!inner(id, telegram_id, username), product_images(image_url)'
          )
          .order('created_at', { ascending: false });

        if (!error && data) {
          setProducts(data);
        }

        setLoading(false);
      }


      async function fetchFavorites(userId) {

        const { data } = await supabaseClient
          .from('favorites')
          .select('product_id')
          .eq('user_id', userId);

        if (data) {
          setFavoriteIds(
            data.map(f => f.product_id)
          );
        }
      }


      async function openProductDetails(prod) {

        setSelectedProduct(prod);

        const newViews =
          (prod.views_count || 0) + 1;

        await supabaseClient
          .from('products')
          .update({
            views_count: newViews
          })
          .eq('id', prod.id);

        setProducts(prev =>
          prev.map(p =>
            p.id === prod.id
              ? { ...p, views_count: newViews }
              : p
          )
        );


        if (prod.users?.id) {

          const { data: revs } = await supabaseClient
            .from('reviews')
            .select('*')
            .eq('seller_id', prod.users.id)
            .order('created_at', {
              ascending: false
            });

          if (revs) {
            setSellerReviews(revs);
          }
        }
      }


      async function toggleFavorite(prod, e) {

        if (e) {
          e.stopPropagation();
        }

        if (!currentDbUser) {
          return;
        }

        const isFav =
          favoriteIds.includes(prod.id);


        if (isFav) {

          setFavoriteIds(
            favoriteIds.filter(
              id => id !== prod.id
            )
          );

          await supabaseClient
            .from('favorites')
            .delete()
            .eq('user_id', currentDbUser.id)
            .eq('product_id', prod.id);

        } else {

          setFavoriteIds([
            ...favoriteIds,
            prod.id
          ]);

          await supabaseClient
            .from('favorites')
            .insert([{
              user_id: currentDbUser.id,
              product_id: prod.id
            }]);

          sendTelegramNotification(
            prod.users?.telegram_id,
            `❤️ *Ваш товар додали в обране!*\n\n📦 *${prod.title}*\n💰 Ціна: ${prod.price_uah} ₴\n👤 Хто додав: ${currentUser.first_name} (@${currentUser.username || 'без_юзернейму'})`
          );
        }
      }


      /*
       * УВАГА:
       * Токен Telegram Bot НЕ зберігаємо в index.html.
       *
       * Якщо тобі потрібні Telegram-сповіщення,
       * їх потрібно відправляти через Supabase Edge Function,
       * де токен зберігається у Secrets.
       *
       * Ця функція залишена безпечною, щоб не викладати токен бота
       * у відкритий frontend-код.
       */
      async function sendTelegramNotification(chatId, text) {

        if (!chatId) {
          return;
        }

        console.log(
          'Telegram notification:',
          chatId,
          text
        );

        /*
         * Тут можна буде викликати окрему Edge Function,
         * наприклад:
         *
         * await supabaseClient.functions.invoke(
         *   'send-telegram-notification',
         *   {
         *     body: {
         *       chatId,
         *       text
         *     }
         *   }
         * );
         */
      }


      function handleFilesAdd(e) {

        const selected =
          Array.from(e.target.files);

        if (
          imageFiles.length +
          selected.length > 5
        ) {
          alert(
            'Максимум 5 фотографій!'
          );

          return;
        }

        const newFiles = [
          ...imageFiles,
          ...selected
        ];

        setImageFiles(newFiles);

        setImagePreviews(
          newFiles.map(file =>
            URL.createObjectURL(file)
          )
        );
      }


      function removeImage(index) {

        const newFiles =
          imageFiles.filter(
            (_, i) => i !== index
          );

        setImageFiles(newFiles);

        setImagePreviews(
          newFiles.map(file =>
            URL.createObjectURL(file)
          )
        );
      }


      function startEditing(prod) {

        setEditingProductId(prod.id);
        setTitle(prod.title);
        setPrice(prod.price_uah);
        setCondition(
          prod.condition || 'used'
        );
        setDescription(
          prod.description || ''
        );
        setCategoryId(
          prod.category_id || ''
        );

        setImageFiles([]);

        setImagePreviews(
          prod.image_url
            ? [prod.image_url]
            : []
        );

        setTab('add');
      }


      function resetForm() {

        setEditingProductId(null);
        setTitle('');
        setPrice('');
        setCondition('used');
        setDescription('');
        setCategoryId('');
        setImageFiles([]);
        setImagePreviews([]);
      }


      async function handleSaveProduct(e) {

        e.preventDefault();

        if (!title || !price) {
          return alert(
            'Будь ласка, вкажіть назву та ціну!'
          );
        }

        setIsSubmitting(true);

        try {

          let uploadedUrls = [];

          for (let file of imageFiles) {

            const fileExt =
              file.name
                .split('.')
                .pop();

            const fileName =
              `${Date.now()}_${Math.random()
                .toString(36)
                .substring(7)}.${fileExt}`;


            const {
              error: uploadErr
            } = await supabaseClient
              .storage
              .from('product-images')
              .upload(
                fileName,
                file
              );


            if (!uploadErr) {

              const {
                data: publicUrlData
              } =
                supabaseClient
                  .storage
                  .from('product-images')
                  .getPublicUrl(
                    fileName
                  );

              uploadedUrls.push(
                publicUrlData.publicUrl
              );
            }
          }


          const mainImage =
            uploadedUrls.length > 0
              ? uploadedUrls[0]
              : (
                  imagePreviews[0] ||
                  null
                );


          if (editingProductId) {

            const {
              error: updateErr
            } = await supabaseClient
              .from('products')
              .update({
                title,
                price_uah:
                  parseFloat(price),
                condition,
                description,
                category_id:
                  categoryId
                    ? parseInt(categoryId)
                    : null,
                image_url:
                  mainImage
              })
              .eq(
                'id',
                editingProductId
              );


            if (updateErr) {
              throw updateErr;
            }

            alert(
              '✏️ Оголошення успішно оновлено!'
            );

          } else {

            const {
              data: newProduct,
              error: prodErr
            } =
              await supabaseClient
                .from('products')
                .insert([{
                  user_id:
                    currentDbUser.id,
                  title,
                  price_uah:
                    parseFloat(price),
                  condition,
                  description,
                  category_id:
                    categoryId
                      ? parseInt(categoryId)
                      : null,
                  image_url:
                    mainImage
                }])
                .select()
                .single();


            if (prodErr) {
              throw prodErr;
            }


            if (
              uploadedUrls.length > 0 &&
              newProduct
            ) {

              const galleryData =
                uploadedUrls.map(
                  url => ({
                    product_id:
                      newProduct.id,
                    image_url:
                      url
                  })
                );

              await supabaseClient
                .from('product_images')
                .insert(
                  galleryData
                );
            }


            sendTelegramNotification(
              currentUser.id,
              `🎉 *Ваше оголошення успішно опубліковане!*\n\n📦 *${title}*\n💰 Ціна: ${price} ₴`
            );


            alert(
              '🎉 Оголошення опубліковано!'
            );
          }


          resetForm();
          setTab('catalog');
          fetchProducts();

        } catch (err) {

          alert(
            'Помилка збереження: ' +
            err.message
          );

        } finally {

          setIsSubmitting(false);
        }
      }


      async function toggleSoldStatus(prod) {

        const newStatus =
          !prod.is_sold;

        const {
          error
        } = await supabaseClient
          .from('products')
          .update({
            is_sold: newStatus
          })
          .eq(
            'id',
            prod.id
          );


        if (!error) {

          setProducts(prev =>
            prev.map(p =>
              p.id === prod.id
                ? {
                    ...p,
                    is_sold:
                      newStatus
                  }
                : p
            )
          );
        }
      }


      async function handleDeleteProduct(id) {

        if (
          !confirm(
            'Ви дійсно хочете видалити це оголошення?'
          )
        ) {
          return;
        }


        const {
          error
        } = await supabaseClient
          .from('products')
          .delete()
          .eq('id', id);


        if (!error) {

          alert(
            'Оголошення видалено!'
          );

          fetchProducts();

        } else {

          alert(
            'Помилка видалення: ' +
            error.message
          );
        }
      }


      /*
       * =====================================================
       * ОПЛАТА БУСТУ ЗА 50 TELEGRAM STARS
       * =====================================================
       *
       * Edge Function:
       *
       * create-telegram-invoice
       *
       * повинна повернути:
       *
       * {
       *   invoiceLink: "https://t.me/..."
       * }
       *
       * Після успішної оплати:
       * статус === "paid"
       *
       * Саме Edge Function повинна перевіряти оплату
       * та змінювати дані оголошення на сервері.
       */
      async function boostProduct(prod) {

        if (!prod?.id) {
          alert(
            'Не вдалося визначити оголошення.'
          );
          return;
        }


        if (prod.is_sold) {
          alert(
            'Продане оголошення не можна підняти в топ.'
          );
          return;
        }


        setBoostingProductId(
          prod.id
        );


        try {

          const {
            data,
            error
          } =
            await supabaseClient.functions.invoke(
              'create-telegram-invoice',
              {
                body: {
                  productId: prod.id,
                  stars: 50,
                  title:
                    'Підняти оголошення в топ',
                  description:
                    'Закріплення товару на перших позиціях на 3 дні'
                }
              }
            );


          if (
            error ||
            !data?.invoiceLink
          ) {

            console.error(
              'Invoice error:',
              error
            );

            alert(
              'Помилка створення рахунку: ' +
              (
                error?.message ||
                'Невідома помилка'
              )
            );

            return;
          }


          /*
           * Telegram Mini App
           */
          if (
            window.Telegram?.WebApp
          ) {

            window.Telegram.WebApp.openInvoice(
              data.invoiceLink,
              async (status) => {

                console.log(
                  'Telegram invoice status:',
                  status
                );


                if (
                  status === 'paid'
                ) {

                  alert(
                    'Оплата успішна! Ваше оголошення піднято в топ 🚀'
                  );

                  /*
                   * Повторно завантажуємо товари,
                   * щоб отримати оновлені дані
                   * з Supabase.
                   */
                  await fetchProducts();

                } else if (
                  status === 'cancelled'
                ) {

                  console.log(
                    'Користувач скасував оплату.'
                  );

                } else {

                  console.log(
                    'Оплату закрито або не завершено:',
                    status
                  );
                }
              }
            );

          } else {

            /*
             * Якщо відкрито не всередині Telegram,
             * відкриваємо invoice у новій вкладці.
             */
            window.open(
              data.invoiceLink,
              '_blank'
            );
          }

        } catch (err) {

          console.error(
            'Boost error:',
            err
          );

          alert(
            'Сталася помилка при спробі оплати.'
          );

        } finally {

          setBoostingProductId(null);
        }
      }


      async function handleAddReview(e) {

        e.preventDefault();

        if (
          !selectedProduct?.users?.id ||
          !currentDbUser
        ) {
          return;
        }


        const {
          error
        } = await supabaseClient
          .from('reviews')
          .insert([{
            seller_id:
              selectedProduct.users.id,
            reviewer_id:
              currentDbUser.id,
            rating:
              parseInt(newRating),
            comment:
              newReviewComment
          }]);


        if (!error) {

          alert(
            'Дякуємо за ваш відгук!'
          );

          setNewReviewComment('');


          const {
            data: revs
          } = await supabaseClient
            .from('reviews')
            .select('*')
            .eq(
              'seller_id',
              selectedProduct.users.id
            )
            .order(
              'created_at',
              {
                ascending: false
              }
            );


          if (revs) {
            setSellerReviews(revs);
          }

        } else {

          alert(
            'Помилка додавання відгуку: ' +
            error.message
          );
        }
      }


      function openSellerChat(username) {

        if (!username) {

          return alert(
            'У продавця немає юзернейму Telegram!'
          );
        }

        tg?.openTelegramLink(
          `https://t.me/${username}`
        );
      }


      function shareProduct(prod) {

        const text =
          `Подивіться товар: ${prod.title} за ${prod.price_uah} ₴ в OLX Mini App!`;


        tg?.openTelegramLink(
          `https://t.me/share/url?url=${encodeURIComponent(
            window.location.href
          )}&text=${encodeURIComponent(
            text
          )}`
        );
      }


      // Фільтрація
      const filteredProducts =
        products
          .filter(prod => {

            const matchesCategory =
              selectedCategory
                ? prod.category_id ===
                  selectedCategory
                : true;


            const matchesSearch =
              prod.title
                .toLowerCase()
                .includes(
                  searchQuery
                    .toLowerCase()
                );


            const matchesMinPrice =
              minPrice
                ? prod.price_uah >=
                  parseFloat(minPrice)
                : true;


            const matchesMaxPrice =
              maxPrice
                ? prod.price_uah <=
                  parseFloat(maxPrice)
                : true;


            const matchesCondition =
              conditionFilter === 'all'
                ? true
                : prod.condition ===
                  conditionFilter;


            return (
              matchesCategory &&
              matchesSearch &&
              matchesMinPrice &&
              matchesMaxPrice &&
              matchesCondition
            );
          })
          .sort((a, b) => {

            if (
              sortOption ===
              'price_asc'
            ) {
              return (
                a.price_uah -
                b.price_uah
              );
            }


            if (
              sortOption ===
              'price_desc'
            ) {
              return (
                b.price_uah -
                a.price_uah
              );
            }


            return (
              new Date(b.created_at) -
              new Date(a.created_at)
            );
          });


      const favoriteProducts =
        products.filter(p =>
          favoriteIds.includes(p.id)
        );


      const myProducts =
        products.filter(p =>
          p.users?.telegram_id ===
          currentUser.id
        );


      const avgRating =
        sellerReviews.length > 0
          ? (
              sellerReviews.reduce(
                (acc, curr) =>
                  acc + curr.rating,
                0
              ) /
              sellerReviews.length
            ).toFixed(1)
          : null;


      return (

        <div class="max-w-md mx-auto min-h-screen flex flex-col justify-between bg-[#002f34] text-white">

          <div>

            {/* HEADER */}
            <header class="p-4 bg-[#002f34] flex justify-between items-center sticky top-0 z-10 border-b border-[#104b50]">

              <div class="flex items-center space-x-2">

                <span class="text-2xl font-black text-[#23e5bf]">
                  OLX
                </span>

                <span class="text-xs bg-[#104b50] text-[#23e5bf] font-bold px-2 py-0.5 rounded">
                  UA
                </span>

              </div>


              <span class="text-xs bg-[#104b50] text-gray-200 font-medium px-2.5 py-1 rounded-full border border-[#1b646a]">
                👤 {currentUser.first_name}
              </span>

            </header>


            {/* CATALOG */}
            {tab === 'catalog' && (

              <main class="p-4">

                {/* Search & Filters */}
                <div class="space-y-2 mb-3">

                  <div class="flex gap-2">

                    <input
                      type="text"
                      placeholder="🔍 Пошук оголошень..."
                      value={searchQuery}
                      onChange={e =>
                        setSearchQuery(
                          e.target.value
                        )
                      }
                      class="flex-1 border border-gray-300 rounded-xl p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-[#23e5bf]"
                    />


                    <button
                      onClick={() =>
                        setShowFilters(
                          !showFilters
                        )
                      }
                      class={`px-3 py-2.5 rounded-xl border text-xs font-bold transition ${
                        showFilters ||
                        minPrice ||
                        maxPrice ||
                        conditionFilter !==
                          'all'
                          ? 'bg-[#23e5bf] text-[#002f34] border-[#23e5bf]'
                          : 'bg-[#00474e] text-white border-[#104b50]'
                      }`}
                    >
                      ⚙️ Фільтри
                    </button>

                  </div>


                  {showFilters && (

                    <div class="bg-[#00383e] p-3 rounded-xl border border-[#104b50] space-y-3">

                      <div>

                        <label class="block text-[11px] font-bold text-gray-300 mb-1">
                          Ціна (грн):
                        </label>

                        <div class="flex gap-2">

                          <input
                            type="number"
                            placeholder="Від"
                            value={minPrice}
                            onChange={e =>
                              setMinPrice(
                                e.target.value
                              )
                            }
                            class="w-1/2 border border-gray-300 rounded-lg p-2 text-xs"
                          />

                          <input

                  </div>


                  {/* Leave review */}
                  <form
                    onSubmit={
                      handleAddReview
                    }
                    class="bg-gray-50 p-3 rounded-xl mb-3 space-y-2"
                  >

                    <div class="flex items-center gap-2">

                      <span class="text-xs font-bold text-gray-600">
                        Оцінка:
                      </span>

                      <select
                        value={newRating}
                        onChange={e =>
                          setNewRating(
                            e.target.value
                          )
                        }
                        class="border rounded p-1 text-xs"
                      >

                        <option value="5">
                          ⭐⭐⭐⭐⭐ (5)
                        </option>

                        <option value="4">
                          ⭐⭐⭐⭐ (4)
                        </option>

                        <option value="3">
                          ⭐⭐⭐ (3)
                        </option>

                        <option value="2">
                          ⭐⭐ (2)
                        </option>

                        <option value="1">
                          ⭐ (1)
                        </option>

                      </select>

                    </div>


                    <input
                      type="text"
                      placeholder="Напишіть відгук про продавця..."
                      value={
                        newReviewComment
                      }
                      onChange={e =>
                        setNewReviewComment(
                          e.target.value
                        )
                      }
                      class="w-full border rounded-lg p-2 text-xs"
                    />


                    <button
                      type="submit"
                      class="w-full bg-gray-800 text-white font-bold py-1.5 rounded-lg text-xs"
                    >
                      Залишити відгук
                    </button>

                  </form>


                  {/* Reviews list */}
                  <div class="space-y-2 max-h-32 overflow-y-auto no-scrollbar">

                    {sellerReviews.map(
                      rev => (

                        <div
                          key={rev.id}
                          class="bg-gray-50 p-2 rounded-lg text-xs"
                        >

                          <div class="flex justify-between font-bold text-amber-500">

                            <span>
                              {'⭐'.repeat(
                                rev.rating
                              )}
                            </span>

                            <span class="text-[10px] text-gray-400">
                              {new Date(
                                rev.created_at
                              ).toLocaleDateString()}
                            </span>

                          </div>


                          <p class="text-gray-700 mt-0.5">
                            {rev.comment}
                          </p>

                        </div>

                      )
                    )}

                  </div>

                </div>


                {/* Bottom buttons */}
                <div class="flex gap-2 mt-5">

                  <button
                    onClick={() =>
                      openSellerChat(
                        selectedProduct
                          .users
                          ?.username
                      )
                    }
                    class="flex-1 bg-[#002f34] text-[#23e5bf] font-black py-3 rounded-xl flex items-center justify-center gap-2 active:scale-95 transition"
                  >
                    <span>💬</span>
                    Написати продавцю
                  </button>


                  <button
                    onClick={e =>
                      toggleFavorite(
                        selectedProduct,
                        e
                      )
                    }
                    class="bg-gray-100 text-gray-700 px-4 py-3 rounded-xl font-bold active:scale-95 transition"
                  >
                    {favoriteIds.includes(
                      selectedProduct.id
                    )
                      ? '❤️'
                      : '🤍'}
                  </button>


                  <button
                    onClick={() =>
                      shareProduct(
                        selectedProduct
                      )
                    }
                    class="bg-gray-100 text-gray-700 px-4 py-3 rounded-xl font-bold active:scale-95 transition"
                  >
                    🔗
                  </button>

                </div>

              </div>

            </div>

          )}


          {/* ===================================================== */}
          {/* BOTTOM NAVIGATION */}
          {/* ===================================================== */}

          <nav class="fixed bottom-0 left-0 right-0 bg-[#002f34] border-t border-[#104b50] flex justify-around py-2.5 max-w-md mx-auto z-20 shadow-lg">

            <button
              onClick={() =>
                setTab('catalog')
              }
              class={`flex flex-col items-center text-xs font-bold transition ${
                tab === 'catalog'
                  ? 'text-[#23e5bf]'
                  : 'text-gray-400'
              }`}
            >

              <span class="text-base mb-0.5">
                🔍
              </span>

              <span>
                Каталог
              </span>

            </button>


            <button
              onClick={() =>
                setTab('favorites')
              }
              class={`flex flex-col items-center text-xs font-bold transition ${
                tab === 'favorites'
                  ? 'text-[#23e5bf]'
                  : 'text-gray-400'
              }`}
            >

              <span class="text-base mb-0.5">
                ❤️
              </span>

              <span>
                Обране
              </span>

            </button>


            <button
              onClick={() =>
                setTab('add')
              }
              class={`flex flex-col items-center text-xs font-bold transition ${
                tab === 'add'
                  ? 'text-[#23e5bf]'
                  : 'text-gray-400'
              }`}
            >

              <span class="text-base mb-0.5">
                ➕
              </span>

              <span>
                Подати
              </span>

            </button>


            <button
              onClick={() =>
                setTab('profile')
              }
              class={`flex flex-col items-center text-xs font-bold transition ${
                tab === 'profile'
                  ? 'text-[#23e5bf]'
                  : 'text-gray-400'
              }`}
            >

              <span class="text-base mb-0.5">
                👤
              </span>

              <span>
                Профіль
              </span>

            </button>

          </nav>

        </div>
      );
    }


    ReactDOM
      .createRoot(
        document.getElementById('root')
      )
      .render(
        <App />
      );

  </script>

</body>
</html>
