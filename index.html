function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


function errorText(error) {

  if (!error) {
    return 'Невідома помилка';
  }

  return [

    error.message,
    error.details,
    error.hint,
    error.code

  ]
    .filter(Boolean)
    .join('\n');

}

  /* =========================

  ========================= */

  async function secureAction(
    action,
    extra = {}
  ) {

    if (!tg?.initData) {

      throw new Error(
        'Telegram initData відсутній.'
      );

    }


    const {
      data,
      error
    } =
      await supabaseClient
        .functions
        .invoke(
          'marketplace-secure',
          {

            body: {

              initData:
                tg.initData,

              action,

              ...extra

            }

          }
        );


    if (error) {

      throw new Error(
        error.message ||
        'Помилка Edge Function'
      );

    }


    if (data?.error) {

      throw new Error(
        data.error
      );

    }


    return data;

  }


  /* =========================

  async function ensureDatabaseUser() {

    const {
      data: existing,
      error
    } =
      await supabaseClient
        .from('users')
        .select('*')
        .eq(
          'telegram_id',
          currentUser.id
        )
        .maybeSingle();


    if (error) {

      throw error;

    }


    if (existing) {

      const updates = {};


      if (
        currentUser.username &&
        currentUser.username !==
        existing.username
      ) {

        updates.username =
          currentUser.username;

      }


      if (
        currentUser.first_name &&
        currentUser.first_name !==
        existing.first_name
      ) {

        updates.first_name =
          currentUser.first_name;

      }


      if (
        currentUser.last_name &&
        currentUser.last_name !==
        existing.last_name
      ) {

        updates.last_name =
          currentUser.last_name;

      }


      if (
        currentUser.photo_url &&
        currentUser.photo_url !==
        existing.photo_url
      ) {

        updates.photo_url =
          currentUser.photo_url;

      }


      if (
        Object.keys(
          updates
        ).length
      ) {

        const {
          data: updated,
          error: updateError
        } =
          await supabaseClient
            .from('users')
            .update(
              updates
            )
            .eq(
              'id',

  /* =========================

  ========================= */

  function tryOpenStartProduct(
    loadedProducts
  ) {

    if (
      startProductOpenedRef
        .current
    ) {

      return;

    }


    const startParam =
      tg?.initDataUnsafe
        ?.start_param;


    if (
      !startParam ||
      !startParam.startsWith(
        'product_'
      )
    ) {

      return;

    }


    const productId =
      Number(
        startParam.replace(
          'product_',
          ''
        )
      );


    if (
      !Number.isFinite(
        productId
      )
    ) {

      return;

    }


    const product =
      loadedProducts.find(
        item =>
          Number(item.id) ===
          productId
      );


    if (!product) {

      return;

    }


    if (
      product.is_sold ||
      product.moderation_status !==
        'approved' ||
      isExpired(product)
    ) {

      return;

    }


    startProductOpenedRef
      .current =
      true;


    setTab(
      'catalog'
    );


    setTimeout(
      () => {

        openProductDetails(
          product
        );

      },
      250
    );

  }

  /* =========================

  ========================= */

  function isExpired(
    prod
  ) {

    return Boolean(

      prod?.expires_at &&

      new Date(
        prod.expires_at
      ) <=
      new Date()

    );

  }


  function daysLeft(
    prod
  ) {

    if (
      !prod?.expires_at
    ) {

      return null;

    }


    const ms =

      new Date(
        prod.expires_at
      ) -

      new Date();


    return Math.max(

      0,

      Math.ceil(
        ms /
        86400000
      )

    );

  }


  function isTop(
    prod
  ) {

    return Boolean(

      prod?.boosted_until &&

      new Date(
        prod.boosted_until
      ) >
      new Date()

    );

  }


  function moderationLabel(
    status
  ) {

    if (
      status ===
      'approved'
    ) {

      return '✅ Схвалено';

    }


    if (
      status ===
      'rejected'
    ) {

      return '❌ Відхилено';

    }


    return '🕐 На модерації';

  }

    const relatedUsers =
      Array.isArray(
        prod.users
      )
        ? prod.users
        : prod.users
          ? [prod.users]
          : [];


    const telegramOwnerMatch =
      relatedUsers.some(

          user?.telegram_id != null &&
          Number(
            user.telegram_id
          ) ===
          Number(
            currentUser.id
          )
      );


    if (telegramOwnerMatch) {

    }


    if (
      prod.user_id != null &&
      ownedUserIds.includes(

    }


    if (

  /* =========================
     SMART SIMILAR PRODUCTS
  ========================= */

  function getSimilarProducts(
    prod
  ) {

    if (!prod) {

      return [];

    }


    const currentPrice =

      Number(
        prod.price_uah ||
        0
      );


    return products

      .filter(
        item => {


          if (
            Number(item.id) ===
            Number(prod.id)
          ) {

            return false;

          }


          if (
            String(
              item.category_id
            ) !==
            String(
              prod.category_id
            )
          ) {

            return false;

          }


          if (
            item.moderation_status !==
            'approved'
          ) {

            return false;

          }


          if (
            item.is_sold
          ) {

            return false;

          }


          if (
            isExpired(item)
          ) {

            return false;

          }


          return true;

        }
      )


      .map(
        item => {


          let score =
            0;


          /* SAME CITY */

          const sameCity =

            prod.city &&
            item.city &&

            String(
              prod.city
            )
              .trim()
              .toLowerCase() ===

            String(
              item.city
            )
              .trim()
              .toLowerCase();


          if (sameCity) {

            score +=
              100;

          }


          /* SAME REGION */

          const sameRegion =

            prod.region &&
            item.region &&

            String(
              prod.region
            )
              .trim()
              .toLowerCase() ===

            String(
              item.region
            )
              .trim()
              .toLowerCase();


          if (sameRegion) {

            score +=
              30;

          }


          /* PRICE */

          const itemPrice =

            Number(
              item.price_uah ||
              0
            );


          if (
            currentPrice > 0 &&
            itemPrice > 0
          ) {

            const diffPercent =

              Math.abs(
                itemPrice -
                currentPrice
              ) /
              currentPrice;


            if (
              diffPercent <=
              0.10
            ) {

              score +=
                80;


            } else if (
              diffPercent <=
              0.20
            ) {

              score +=
                65;


            } else if (
              diffPercent <=
              0.30
            ) {

              score +=
                50;


            } else if (
              diffPercent <=
              0.50
            ) {

              score +=
                25;

            }

          }


          /* CONDITION */

          if (
            prod.condition &&
            item.condition ===
            prod.condition
          ) {

            score +=
              15;

          }


          /* TOP */

          if (
            isTop(item)
          ) {

            score +=
              10;

          }


          return {

            ...item,

            _similarityScore:
              score,

            _priceDifference:

              Math.abs(

                Number(
                  item.price_uah ||
                  0
                ) -

                currentPrice

              )

          };

        }
      )


      .sort(
        (a, b) => {


          if (
            b._similarityScore !==
            a._similarityScore
          ) {

            return (

              b._similarityScore -
              a._similarityScore

            );

          }


          if (
            a._priceDifference !==
            b._priceDifference
          ) {

            return (

              a._priceDifference -
              b._priceDifference

            );

          }


          return (

            new Date(
              b.created_at
            ) -

            new Date(
              a.created_at
            )

          );

        }
      )


      .slice(
        0,
        4
      );

  }

  async function uploadNewImages() {

    const uploaded =
      [];


    for (
      const file of imageFiles
    ) {

      const extension =

        (
          file.name
            ?.split('.')
            .pop() ||
          'jpg'
        )
          .toLowerCase()
          .replace(
            /[^a-z0-9]/g,
            ''
          ) ||
        'jpg';


      const path =

        `${currentUser.id}/` +

        `${Date.now()}_` +

        `${Math.random()
          .toString(36)
          .slice(2)}.` +

        extension;


      const {
        error
      } =
        await supabaseClient
          .storage
          .from(
            'product-images'
          )
          .upload(
            path,
            file,
            {
              upsert: false
            }
          );


      if (error) {

        throw error;

      }


      const {
        data
      } =
        supabaseClient
          .storage
          .from(
            'product-images'
          )
          .getPublicUrl(
            path
          );


      if (
        data?.publicUrl
      ) {

        uploaded.push(
          data.publicUrl
        );

      }

    }


    return uploaded;

  }

  async function handleSaveProduct(
    event
  ) {

    event.preventDefault();


    if (
      !currentDbUser?.id
    ) {

      return alert(
        'Профіль не завантажений.'
      );

    }


    if (
      currentDbUser.is_banned
    ) {

      return alert(
        'Ваш акаунт заблоковано.'
      );

    }


    if (
      !title.trim()
    ) {

      return alert(
        'Вкажіть назву.'
      );

    }


    if (!categoryId) {

      return alert(
        'Оберіть категорію.'
      );

    }


    if (!region) {

      return alert(
        'Оберіть область.'
      );

    }


    if (
      !city
    ) {

      return alert(
        'Оберіть місто.'
      );

    }


    if (
      !citiesForRegion(
        region
      ).includes(
        city
      )
    ) {

      return alert(
        'Оберіть місто, яке належить до вибраної області.'
      );

    }


    const parsedPrice =
      Number(price);


    if (
      !Number.isFinite(
        parsedPrice
      ) ||
      parsedPrice < 0
    ) {

      return alert(
        'Вкажіть правильну ціну.'
      );

    }


    setIsSubmitting(
      true
    );


    try {

      const uploaded =
        await uploadNewImages();


      const finalImages =

        [
          ...existingImageUrls,
          ...uploaded
        ]
          .filter(Boolean)
          .slice(
            0,
            5
          );


      const payload = {

        title:
          title.trim(),

        price_uah:
          parsedPrice,

        condition,

        description:
          description.trim(),

        category_id:
          Number(
            categoryId
          ),

        region,

        city:
          city.trim(),

        image_url:
          finalImages[0] ||
          null

      };


      /* EDIT */

      if (
        editingProductId
      ) {

        const editingProduct =
          products.find(
            item =>
              String(
                item.id
              ) ===
              String(
                editingProductId
              )
          );


        const editingOwnerId =
          editingProductOwnerId ??
          editingProduct?.user_id ??
          storedProductOwnerId(
            editingProduct
          );


        if (
          editingOwnerId == null
        ) {

          throw new Error(
            'Не вдалося визначити власника оголошення. Онови сторінку і спробуй ще раз.'
          );

        }


        const {
          error
        } =
          await supabaseClient
            .from('products')
            .update({

              ...payload,

              moderation_status:
                'pending',

              moderation_reason:
                null,

              moderated_at:
                null

            })
            .eq(
              'id',
              editingProductId
            )
            .eq(
              'user_id',
              editingOwnerId
            );


        if (error) {

          throw error;

        }


        await supabaseClient
          .from(
            'product_images'
          )
          .delete()
          .eq(
            'product_id',
            editingProductId
          );


        if (
          finalImages.length
        ) {

          const {
            error: galleryError
          } =
            await supabaseClient

  /* =========================
     BOOST
  ========================= */

  async function waitForBoost(
    productId
  ) {

    for (
      let i = 0;
      i < 10;
      i++
    ) {

      const {
        data
      } =
        await supabaseClient
          .from('products')
          .select(
            'boosted_until'
          )
          .eq(
            'id',
            productId
          )
          .maybeSingle();


      if (
        data?.boosted_until &&
        new Date(
          data.boosted_until
        ) >
        new Date()
      ) {

        return true;

      }


      await sleep(
        1500
      );

    }


    return false;

  }


  async function boostProduct(
    prod
  ) {

    setBoostingProductId(
      prod.id
    );


    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .functions
          .invoke(
            'create-telegram-invoice',
            {

              body: {

                productId:
                  prod.id,

                telegramUserId:
                  currentUser.id

              }

            }
          );


      if (
        error ||
        !data?.invoiceLink
      ) {

        throw new Error(

          data?.error ||

          error?.message ||

          'Не вдалося створити рахунок.'

        );

      }


      tg?.openInvoice(

        data.invoiceLink,

        async status => {


          if (
            status ===
            'paid'
          ) {

            await waitForBoost(
              prod.id
            );


            await fetchProducts();


            alert(
              '⭐ TOP активовано.'
            );


          } else if (
            status ===
            'failed'
          ) {

            alert(
              'Оплата не пройшла.'
            );

          }

        }

      );


    } catch (error) {

      alert(
        errorText(error)
      );


    } finally {

      setBoostingProductId(
        null
      );

    }

  }

  const catalogProducts =

    products

      .filter(
        prod => {


          if (
            prod.is_sold ||
            isExpired(prod) ||
            prod.moderation_status !==
              'approved'
          ) {

            return false;

          }


          if (
            selectedCategory &&
            String(
              prod.category_id
            ) !==
            String(
              selectedCategory
            )
          ) {

            return false;

          }


          if (
            searchQuery &&

            !String(
              prod.title ||
              ''
            )
              .toLowerCase()
              .includes(
                searchQuery
                  .toLowerCase()
              )
          ) {

            return false;

          }


          if (
            filterRegion &&
            prod.region !==
            filterRegion
          ) {

            return false;

          }


          if (
            filterCity &&

            !String(
              prod.city ||
              ''
            )
              .toLowerCase()
              .includes(
                filterCity
                  .toLowerCase()
              )
          ) {

            return false;

          }


          if (
            minPrice &&
            Number(
              prod.price_uah
            ) <
            Number(
              minPrice
            )
          ) {

            return false;

          }


          if (
            maxPrice &&
            Number(
              prod.price_uah
            ) >
            Number(
              maxPrice
            )
          ) {

            return false;

          }


          if (
            conditionFilter !==
              'all' &&

            prod.condition !==
            conditionFilter
          ) {

            return false;

          }


          return true;

        }
      )


      .sort(
        (a, b) => {


          const topA =
            isTop(a);


          const topB =
            isTop(b);


          if (
            topA !== topB
          ) {

            return topA
              ? -1
              : 1;

          }


          if (
            sortOption ===
            'price_asc'
          ) {

            return (

              Number(
                a.price_uah
              ) -

              Number(
                b.price_uah
              )

            );

          }


          if (
            sortOption ===
            'price_desc'
          ) {

            return (

              Number(
                b.price_uah
              ) -

              Number(
                a.price_uah
              )

            );

          }


          return (

            new Date(
              b.created_at
            ) -

            new Date(
              a.created_at
            )

          );

      );

                                        px-1.5
                                        py-0.5
                                        text-[8px]
                                        font-black
                                      "
                                    >
                                      📍 Те саме місто
                                    </span>

                                  )}


                                  {
                                    priceDiffPct !==
                                      null &&

                                    priceDiffPct <=
                                      30 && (

                                    <span
                                      className="
                                        bg-blue-100
                                        text-blue-700
                                        rounded
                                        px-1.5
                                        py-0.5
                                        text-[8px]
                                        font-black
                                      "
                                    >
                                      💰 Схожа ціна
                                    </span>

                                  )}

                                </div>

                              </div>

                            </button>

                          );

                        }
                      )
                  }

                </div>

              </div>

            )}

          </div>

        </div>

      )}


      {/* =========================
          SELLER PROFILE MODAL
      ========================= */}

      {selectedSeller && (

        <div
          className="
            fixed
            inset-0
            z-50
            bg-black/80
            flex
            items-end
            justify-center
          "
        >


          <div
            className="
              bg-white
              text-[#002f34]
              w-full
              max-w-md
              max-h-[92vh]
              overflow-y-auto
              rounded-t-3xl
              p-5
              relative
            "
          >


            <button
              onClick={() =>
                setSelectedSeller(
                  null
                )
              }
              className="
                absolute
                top-4
                right-4
                w-9
                h-9
                bg-gray-200
                rounded-full
                font-black
              "
            >
              ×
            </button>


            <div
              className="
                flex
                gap-3
                items-center
                pr-10
              "
            >


              {selectedSeller
                .photo_url ? (

                <img
                  src={
                    selectedSeller
                      .photo_url
                  }
                  className="
                    w-16
                    h-16
                    rounded-full
                    object-cover
                  "
                />

              ) : (

                <div
                  className="
                    w-16
                    h-16
                    rounded-full
                    bg-gray-100
                    flex
                    items-center
                    justify-center
                    text-2xl
                  "
                >
                  👤
                </div>

              )}


              <div>

                <h2
                  className="
                    text-xl
                    font-black
                  "
                >

                  {
                    selectedSeller
                      .first_name ||

                    selectedSeller
                      .username ||

                    'Продавець'
                  }


                  {
                    selectedSeller
                      .is_verified
                      ? ' ✓'
                      : ''
                  }

                </h2>


                {selectedSeller
                  .username && (

                  <div
                    className="
                      text-xs
                      text-gray-500
                    "
                  >
                    @{
                      selectedSeller.username
                    }
                  </div>

                )}


                <div
                  className="
                    text-xs
                    font-black
                    text-amber-600
                    mt-1
                  "
                >

                  ⭐ {
                    sellerProfileRating

                      ? `${sellerProfileRating}/5`

                      : 'Немає оцінок'
                  }

                </div>

              </div>

            </div>


            {selectedSeller
              .username && (

              <button
                onClick={() =>
                  openSellerChat(
                    selectedSeller.username
                  )
                }
                className="
                  w-full
                  mt-4
                  bg-[#002f34]
                  text-[#23e5bf]
                  rounded-xl
                  py-3
                  font-black
                "
              >
                💬 Написати продавцю
              </button>

            )}


            {/* SELLER PRODUCTS */}

            <div
              className="
                border-t
                mt-5
                pt-4
              "
            >

              <h3
                className="
                  font-black
                  mb-3
                "
              >
                📦 Активні оголошення ({
                  sellerProducts.length
                })
              </h3>


              {sellerLoading ? (

                <div
                  className="
                    text-center
                    py-8
                  "
                >
                  Завантаження...
                </div>

              ) : sellerProducts.length ? (

                <div
                  className="
                    grid
                    grid-cols-2
                    gap-3
                  "
                >


                  {sellerProducts.map(
                    prod => (

                    <button
                      key={
                        prod.id
                      }
                      onClick={() => {

                        setSelectedSeller(
                          null
                        );


                        setTimeout(
                          () =>
                            openProductDetails(
                              prod
                            ),
                          100
                        );

                      }}
                      className="
                        text-left
                        border
                        rounded-xl
                        overflow-hidden
                      "
                    >


                      {prod.image_url ? (

                        <img
                          src={
                            prod.image_url
                          }
                          className="
                            w-full
                            h-28
                            object-contain
                            bg-gray-100
                          "
                        />

                      ) : (

                        <div
                          className="
                            w-full
                            h-28
                            bg-gray-100
                            flex
                            items-center
                            justify-center
                          "
                        >
                          🖼️
                        </div>

                      )}


                      <div
                        className="
                          p-2
                        "
                      >

                        <div
                          className="
                            text-xs
                            font-black
                            line-clamp-2
                          "
                        >
                          {
                            prod.title
                          }
                        </div>


                        <div
                          className="
                            font-black
                            mt-1
                          "
                        >
                          {
                            prod.price_uah
                          } ₴
                        </div>

                      </div>

                    </button>

                  ))}

                </div>

              ) : (

                <div
                  className="
                    text-xs
                    text-gray-500
                  "
                >
                  Активних оголошень немає.
                </div>

              )}

            </div>


            {/* SELLER REVIEWS */}

            <div
              className="
                border-t
                mt-5
                pt-4
              "
            >

              <h3
                className="
                  font-black
                  mb-3
                "
              >
                ⭐ Відгуки ({
                  sellerProfileReviews.length
                })
              </h3>


              <div
                className="
                  space-y-2
                "
              >


                {sellerProfileReviews.map(
                  review => (

                  <div
                    key={
                      review.id
                    }
                    className="
                      bg-gray-50
                      rounded-xl
                      p-3
                      text-xs
                    "
                  >

                    <div
                      className="
                        text-amber-600
                        font-black
                      "
                    >
                      {
                        '⭐'.repeat(
                          Number(
                            review.rating ||
                            0
                          )
                        )
                      }
                    </div>


                    <div
                      className="
                        mt-1
                      "
                    >
                      {
                        review.comment
                      }
                    </div>

                  </div>

                ))}


                {!sellerProfileReviews.length && (

                  <div
                    className="
                      text-xs
                      text-gray-500
                    "
                  >
                    Ще немає відгуків.
                  </div>

                )}

              </div>

            </div>

          </div>

        </div>

      )}


      {/* =========================
          REPORT MODAL
      ========================= */}

      {showReportModal && (

        <div
          className="
            fixed
            inset-0
            z-[70]
            bg-black/80
            flex
            items-center
            justify-center
            p-4
          "
        >


          <div
            className="
              bg-white
              text-[#002f34]
              rounded-2xl
              p-5
              w-full
              max-w-md
            "
          >


            <h3
              className="
                font-black
              "
            >
              ⚠️ Поскаржитися
            </h3>


            <select
              value={
                reportReason
              }
              onChange={e =>
                setReportReason(
                  e.target.value
                )
              }
              className="
                w-full
                p-3
                mt-3
                rounded-xl
              "
            >

              <option value="fraud">
                Шахрайство
              </option>

              <option value="spam">
                Спам
              </option>

              <option value="prohibited">
                Заборонений товар
              </option>

              <option value="wrong_info">
                Неправдива інформація
              </option>

              <option value="other">
                Інше
              </option>

            </select>


            <textarea
              value={
                reportDetails
              }
              onChange={e =>
                setReportDetails(
                  e.target.value
                )
              }
              className="
                w-full
                mt-3
                p-3
                rounded-xl
              "
              placeholder="Деталі"
            />


            <button
              disabled={
                sendingReport
              }
              onClick={
                submitReport
              }
              className="
                w-full
                mt-3
                bg-red-600
                text-white
                rounded-xl
                py-3
                disabled:opacity-50
              "
            >
              {
                sendingReport
                  ? 'Надсилання...'
                  : 'Надіслати'
              }
            </button>


            <button
              onClick={() =>
                setShowReportModal(
                  false
                )
              }
              className="
                w-full
                mt-2
                bg-gray-200
                rounded-xl
                py-3
              "
            >
              Скасувати
            </button>

          </div>

        </div>

      )}


      {/* =========================
          NAV
      ========================= */}

      <nav
        className="
          fixed
          bottom-0
          left-0
          right-0
          max-w-md
          mx-auto
          bg-[#002f34]
          border-t
          border-[#104b50]
          flex
          justify-around
          py-3
          z-40
        "
      >


        <button
          onClick={() =>
            setTab(
              'catalog'
            )
          }
          className={
            tab === 'catalog'
              ? 'text-[#23e5bf]'
              : 'text-gray-400'
          }
        >
          🔍

          <div
            className="
              text-[10px]
            "
          >
            Каталог
          </div>
        </button>


        <button
          onClick={() =>
            setTab(
              'favorites'
            )
          }
          className={
            tab === 'favorites'
              ? 'text-[#23e5bf]'
              : 'text-gray-400'
          }
        >
          ❤️

          <div
            className="
              text-[10px]
            "
          >
            Обране
          </div>
        </button>


        <button
          onClick={() => {

            resetForm();

            setTab(
              'add'
            );

          }}
          className={
            tab === 'add'
              ? 'text-[#23e5bf]'
              : 'text-gray-400'
          }
        >
          ➕

          <div
            className="
              text-[10px]
            "
          >
            Подати
          </div>
        </button>


        <button
          onClick={() =>
            setTab(
              'profile'
            )
          }
          className={
            tab === 'profile'
              ? 'text-[#23e5bf]'
              : 'text-gray-400'
          }
        >
          👤

          <div
            className="
              text-[10px]
            "
          >
            Профіль
          </div>
        </button>

      </nav>

    </div>

  );

}


/* =========================
   RENDER
========================= */

ReactDOM
  .createRoot(
    document.getElementById(
      'root'
    )
  )
  .render(
    <App />
  );

</script>

</body>
</html>
