<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telegram OLX Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #f4f4f5;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    input, textarea, select {
      color: #111827 !important;
      background-color: #ffffff !important;
    }
  </style>
</head>
<body class="pb-20">
  <div id="root"></div>

  <script type="text/babel">
    const SUPABASE_URL = 'https://dhjrvpnbeapybgomwelc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRoanJ2cG5iZWFweWJnb213ZWxjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMDk1NzMsImV4cCI6MjEwMzc4NTU3M30.-syhXj3B7AN-una0dIqCWZOk-wHaHfelBK_VdqduibY';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const tg = window.Telegram?.WebApp;

    function App() {
      const [products, setProducts] = React.useState([]);
      const [categories, setCategories] = React.useState([]);
      const [selectedCategory, setSelectedCategory] = React.useState(null);
      const [loading, setLoading] = React.useState(true);
      const [tab, setTab] = React.useState('catalog');

      const [title, setTitle] = React.useState('');
      const [price, setPrice] = React.useState('');
      const [description, setDescription] = React.useState('');
      const [categoryId, setCategoryId] = React.useState('');
      const [isSubmitting, setIsSubmitting] = React.useState(false);

      React.useEffect(() => {
        tg?.ready();
        tg?.expand();
        fetchCategories();
        fetchProducts();
      }, []);

      async function fetchCategories() {
        const { data, error } = await supabaseClient.from('categories').select('*');
        if (!error && data) setCategories(data);
      }

      async function fetchProducts(catId = null) {
        setLoading(true);
        let query = supabaseClient.from('products').select('*, categories(title)').eq('status', 'active').order('created_at', { ascending: false });
        if (catId) query = query.eq('category_id', catId);
        
        const { data, error } = await query;
        if (!error && data) setProducts(data);
        setLoading(false);
      }

      function handleCategorySelect(id) {
        const newCat = selectedCategory === id ? null : id;
        setSelectedCategory(newCat);
        fetchProducts(newCat);
      }

      async function handleCreateProduct(e) {
        e.preventDefault();
        if (!title || !price) return alert('Будь ласка, вкажіть назву та ціну товару!');
        
        setIsSubmitting(true);
        const user = tg?.initDataUnsafe?.user || { id: 9999999, username: 'telegram_user' };

        try {
          let { data: dbUser } = await supabaseClient.from('users').select('id').eq('telegram_id', user.id).maybeSingle();
          
          if (!dbUser) {
            const { data: newUser, error: userErr } = await supabaseClient.from('users').insert([{
              telegram_id: user.id,
              username: user.username || `user_${user.id}`
            }]).select().single();
            if (userErr) throw userErr;
            dbUser = newUser;
          }

          const { error: prodErr } = await supabaseClient.from('products').insert([{
            user_id: dbUser.id,
            title,
            price_uah: parseFloat(price),
            description,
            category_id: categoryId ? parseInt(categoryId) : null
          }]);

          if (prodErr) throw prodErr;

          alert('🎉 Оголошення успішно опубліковано!');
          setTitle(''); setPrice(''); setDescription(''); setCategoryId('');
          setTab('catalog');
          fetchProducts();
        } catch (err) {
          alert('Помилка при публікації: ' + err.message);
        } finally {
          setIsSubmitting(false);
        }
      }

      return (
        <div class="max-w-md mx-auto min-h-screen flex flex-col justify-between bg-zinc-100 text-gray-900">
          <div>
            <header class="p-4 bg-white shadow-sm flex justify-between items-center sticky top-0 z-10 border-b">
              <div class="flex items-center space-x-2">
                <span class="text-2xl">🛒</span>
                <h1 class="text-xl font-bold text-gray-900">OLX Telegram</h1>
              </div>
              <span class="text-xs bg-blue-50 text-blue-600 font-semibold px-2.5 py-1 rounded-full border border-blue-200">
                👤 {tg?.initDataUnsafe?.user?.first_name || 'Користувач'}
              </span>
            </header>

            {tab === 'catalog' && (
              <main class="p-4">
                <div class="flex gap-2 overflow-x-auto pb-3 mb-3 no-scrollbar">
                  <button
                    onClick={() => handleCategorySelect(null)}
                    class={`px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all ${
                      selectedCategory === null ? 'bg-blue-600 text-white shadow-sm' : 'bg-white text-gray-700 border border-gray-200'
                    }`}
                  >
                    Всі товари
                  </button>
                  {categories.map(cat => (
                    <button
                      key={cat.id}
                      onClick={() => handleCategorySelect(cat.id)}
                      class={`px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all ${
                        selectedCategory === cat.id ? 'bg-blue-600 text-white shadow-sm' : 'bg-white text-gray-700 border border-gray-200'
                      }`}
                    >
                      {cat.title}
                    </button>
                  ))}
                </div>

                {loading ? (
                  <div class="text-center py-16 text-gray-500 font-medium">Завантаження оголошень...</div>
                ) : products.length === 0 ? (
                  <div class="text-center py-16 text-gray-500 bg-white rounded-xl border border-dashed p-6">
                    <p class="text-2xl mb-2">📦</p>
                    <p class="font-medium text-gray-700">Оголошень поки немає</p>
                    <p class="text-xs text-gray-500 mt-1">Будьте першим, хто створить товар!</p>
                  </div>
                ) : (
                  <div class="grid grid-cols-2 gap-3">
                    {products.map(prod => (
                      <div key={prod.id} class="bg-white rounded-xl shadow-sm overflow-hidden flex flex-col justify-between p-3 border border-gray-100">
                        <div>
                          <div class="w-full h-28 bg-gray-100 rounded-lg mb-2.5 flex items-center justify-center text-gray-400 text-2xl font-light">
                            🖼️
                          </div>
                          <span class="text-[10px] uppercase font-bold text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded">
                            {prod.categories?.title || 'Товар'}
                          </span>
                          <h3 class="font-semibold text-sm text-gray-800 line-clamp-2 mt-1.5 leading-snug">{prod.title}</h3>
                          {prod.description && (
                            <p class="text-xs text-gray-500 line-clamp-1 mt-1">{prod.description}</p>
                          )}
                        </div>
                        <div class="mt-3 pt-2 border-t border-gray-50 flex justify-between items-center">
                          <span class="text-base font-bold text-emerald-600">{prod.price_uah} ₴</span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </main>
            )}

            {tab === 'add' && (
              <main class="p-4">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                  <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
                    <span>➕</span> Нове оголошення
                  </h2>
                  <form onSubmit={handleCreateProduct} class="space-y-4">
                    <div>
                      <label class="block text-xs font-semibold text-gray-700 mb-1">Назва товару *</label>
                      <input
                        type="text"
                        required
                        placeholder="напр. Навушники AirPods Pro"
                        value={title}
                        onChange={e => setTitle(e.target.value)}
                        class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-900 bg-white"
                      />
                    </div>
                    <div>
                      <label class="block text-xs font-semibold text-gray-700 mb-1">Ціна (в гривнях ₴) *</label>
                      <input
                        type="number"
                        required
                        step="0.01"
                        placeholder="0.00"
                        value={price}
                        onChange={e => setPrice(e.target.value)}
                        class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-900 bg-white"
                      />
                    </div>
                    <div>
                      <label class="block text-xs font-semibold text-gray-700 mb-1">Категорія</label>
                      <select
                        value={categoryId}
                        onChange={e => setCategoryId(e.target.value)}
                        class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-900 bg-white"
                      >
                        <option value="">Оберіть категорію</option>
                        {categories.map(cat => (
                          <option key={cat.id} value={cat.id}>{cat.title}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label class="block text-xs font-semibold text-gray-700 mb-1">Опис товару</label>
                      <textarea
                        rows="3"
                        placeholder="Розкажіть про стан товару, комплект..."
                        value={description}
                        onChange={e => setDescription(e.target.value)}
                        class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-900 bg-white"
                      ></textarea>
                    </div>
                    <button
                      type="submit"
                      disabled={isSubmitting}
                      class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-sm hover:bg-blue-700 active:scale-[0.99] transition disabled:opacity-50"
                    >
                      {isSubmitting ? 'Публікація...' : 'Опублікувати оголошення'}
                    </button>
                  </form>
                </div>
              </main>
            )}
          </div>

          <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-2.5 max-w-md mx-auto z-20 shadow-lg">
            <button
              onClick={() => setTab('catalog')}
              class={`flex flex-col items-center text-xs font-medium transition ${tab === 'catalog' ? 'text-blue-600 font-bold' : 'text-gray-400'}`}
            >
              <span class="text-base mb-0.5">🔍</span>
              <span>Каталог</span>
            </button>
            <button
              onClick={() => setTab('add')}
              class={`flex flex-col items-center text-xs font-medium transition ${tab === 'add' ? 'text-blue-600 font-bold' : 'text-gray-400'}`}
            >
              <span class="text-base mb-0.5">➕</span>
              <span>Подати</span>
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
