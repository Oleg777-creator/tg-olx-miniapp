<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telegram OLX Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #002f34;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Жорстке фіксування стилів вводу */
    input, textarea, select {
      color: #002f34 !important;
      -webkit-text-fill-color: #002f34 !important;
      background-color: #ffffff !important;
      opacity: 1 !important;
    }
    input::placeholder, textarea::placeholder {
      color: #64748b !important;
      -webkit-text-fill-color: #64748b !important;
    }
  </style>
</head>
<body class="pb-20">
  <div id="root"></div>

  <script type="text/babel">
    const SUPABASE_URL = 'https://dhjrvpnbeapybgomwelc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRoanJ2cG5iZWFweWJnb213ZWxjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMDk1NzMsImV4cCI6MjEwMzc4NTU3M30.-syhXj3B7AN-una0dIqCWZOk-wHaHfelBK_VdqduibY';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const tg = window.Telegram?.WebApp;

    function App() {
      const [products, setProducts] = React.useState([]);
      const [categories, setCategories] = React.useState([]);
      const [selectedCategory, setSelectedCategory] = React.useState(null);
      const [loading, setLoading] = React.useState(true);
      const [tab, setTab] = React.useState('catalog');

      const [title, setTitle] = React.useState('');
      const [price, setPrice] = React.useState('');
      const [description, setDescription] = React.useState('');
      const [categoryId, setCategoryId] = React.useState('');
      const [imageFile, setImageFile] = React.useState(null);
      const [imagePreview, setImagePreview] = React.useState(null);
      const [isSubmitting, setIsSubmitting] = React.useState(false);

      React.useEffect(() => {
        tg?.ready();
        tg?.expand();
        fetchCategories();
        fetchProducts();
      }, []);

      async function fetchCategories() {
        const { data, error } = await supabaseClient.from('categories').select('*');
        if (!error && data) setCategories(data);
      }

      async function fetchProducts(catId = null) {
        setLoading(true);
        let query = supabaseClient.from('products').select('*, categories(title), users(username)').eq('status', 'active').order('created_at', { ascending: false });
        if (catId) query = query.eq('category_id', catId);
        
        const { data, error } = await query;
        if (!error && data) setProducts(data);
        setLoading(false);
      }

      function handleCategorySelect(id) {
        const newCat = selectedCategory === id ? null : id;
        setSelectedCategory(newCat);
        fetchProducts(newCat);
      }

      function handleFileChange(e) {
        const file = e.target.files[0];
        if (file) {
          setImageFile(file);
          setImagePreview(URL.createObjectURL(file));
        }
      }

      async function handleCreateProduct(e) {
        e.preventDefault();
        if (!title || !price) return alert('Будь ласка, вкажіть назву та ціну товару!');
        
        setIsSubmitting(true);
        const user = tg?.initDataUnsafe?.user || { id: 9999999, username: 'telegram_user' };

        try {
          let { data: dbUser } = await supabaseClient.from('users').select('id').eq('telegram_id', user.id).maybeSingle();
          
          if (!dbUser) {
            const { data: newUser, error: userErr } = await supabaseClient.from('users').insert([{
              telegram_id: user.id,
              username: user.username || `user_${user.id}`
            }]).select().single();
            if (userErr) throw userErr;
            dbUser = newUser;
          }

          let imageUrl = null;
          if (imageFile) {
            const fileExt = imageFile.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
            
            const { error: uploadErr } = await supabaseClient.storage
              .from('product-images')
              .upload(fileName, imageFile);

            if (uploadErr) throw uploadErr;

            const { data: publicUrlData } = supabaseClient.storage
              .from('product-images')
              .getPublicUrl(fileName);

            imageUrl = publicUrlData.publicUrl;
          }

          const { error: prodErr } = await supabaseClient.from('products').insert([{
            user_id: dbUser.id,
            title,
            price_uah: parseFloat(price),
            description,
            category_id: categoryId ? parseInt(categoryId) : null,
            image_url: imageUrl
          }]);

          if (prodErr) throw prodErr;

          alert('🎉 Оголошення успішно опубліковано!');
          setTitle(''); setPrice(''); setDescription(''); setCategoryId('');
          setImageFile(null); setImagePreview(null);
          setTab('catalog');
          fetchProducts();
        } catch (err) {
          alert('Помилка при публікації: ' + err.message);
        } finally {
          setIsSubmitting(false);
        }
      }

      function openSellerChat(username) {
        if (!username) return alert('У продавця немає юзернейму в Telegram!');
        tg?.openTelegramLink(`https://t.me/${username}`);
      }

      return (
        <div class="max-w-md mx-auto min-h-screen flex flex-col justify-between bg-[#002f34] text-white">
          <div>
            {/* Header */}
            <header class="p-4 bg-[#002f34] flex justify-between items-center sticky top-0 z-10 border-b border-[#104b50]">
              <div class="flex items-center space-x-2">
                <span class="text-2xl font-black text-[#23e5bf]">OLX</span>
                <span class="text-xs bg-[#104b50] text-[#23e5bf] font-bold px-2 py-0.5 rounded">UA</span>
              </div>
              <span class="text-xs bg-[#104b50] text-gray-200 font-medium px-2.5 py-1 rounded-full border border-[#1b646a]">
                👤 {tg?.initDataUnsafe?.user?.first_name || 'Користувач'}
              </span>
            </header>

            {/* Catalog */}
            {tab === 'catalog' && (
              <main class="p-4">
                <div class="flex gap-2 overflow-x-auto pb-3 mb-3 no-scrollbar">
                  <button
                    onClick={() => handleCategorySelect(null)}
                    class={`px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all ${
                      selectedCategory === null ? 'bg-[#23e5bf] text-[#002f34]' : 'bg-[#00474e] text-white border border-[#104b50]'
                    }`}
                  >
                    Всі товари
                  </button>
                  {categories.map(cat => (
                    <button
                      key={cat.id}
                      onClick={() => handleCategorySelect(cat.id)}
                      class={`px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all ${
                        selectedCategory === cat.id ? 'bg-[#23e5bf] text-[#002f34]' : 'bg-[#00474e] text-white border border-[#104b50]'
                      }`}
                    >
                      {cat.title}
                    </button>
                  ))}
                </div>

                {loading ? (
                  <div class="text-center py-16 text-[#23e5bf] font-medium">Завантаження оголошень...</div>
                ) : products.length === 0 ? (
                  <div class="text-center py-16 text-gray-300 bg-[#00383e] rounded-2xl border border-[#104b50] p-6">
                    <p class="text-3xl mb-2">📦</p>
                    <p class="font-bold text-white">Оголошень поки немає</p>
                    <p class="text-xs text-gray-400 mt-1">Опублікуйте першу пропозицію!</p>
                  </div>
                ) : (
                  <div class="grid grid-cols-2 gap-3">
                    {products.map(prod => (
                      <div key={prod.id} class="bg-white rounded-xl overflow-hidden flex flex-col justify-between p-2.5 text-[#002f34] shadow-md">
                        <div>
                          {prod.image_url ? (
                            <img src={prod.image_url} alt={prod.title} class="w-full h-28 object-cover rounded-lg mb-2" />
                          ) : (
                            <div class="w-full h-28 bg-gray-100 rounded-lg mb-2 flex items-center justify-center text-gray-400 text-2xl">
                              🖼️
                            </div>
                          )}
                          <span class="text-[9px] uppercase font-black text-[#002f34] bg-[#23e5bf] px-1.5 py-0.5 rounded">
                            {prod.categories?.title || 'Товар'}
                          </span>
                          <h3 class="font-bold text-xs text-[#002f34] line-clamp-2 mt-1 leading-snug">{prod.title}</h3>
                          {prod.description && (
                            <p class="text-[11px] text-gray-500 line-clamp-1 mt-0.5">{prod.description}</p>
                          )}
                        </div>
                        <div class="mt-2 pt-2 border-t border-gray-100">
                          <div class="text-sm font-black text-[#002f34] mb-1.5">{prod.price_uah} ₴</div>
                          <button
                            onClick={() => openSellerChat(prod.users?.username)}
                            class="w-full bg-[#002f34] text-[#23e5bf] font-bold text-[11px] py-1.5 rounded-lg flex items-center justify-center gap-1 active:scale-95 transition"
                          >
                            <span>💬</span> Написати
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </main>
            )}

            {/* Form */}
            {tab === 'add' && (
              <main class="p-4">
                <div class="bg-[#00383e] p-5 rounded-2xl border border-[#104b50] shadow-lg">
                  <h2 class="text-lg font-black text-white mb-4 flex items-center gap-2">
                    <span class="text-[#23e5bf]">➕</span> Нове оголошення
                  </h2>
                  <form onSubmit={handleCreateProduct} class="space-y-4">
                    <div>
                      <label class="block text-xs font-bold text-gray-200 mb-1">Назва товару *</label>
                      <input
                        type="text"
                        required
                        placeholder="напр. Навушники AirPods Pro"
                        value={title}
                        onChange={e => setTitle(e.target.value)}
                        class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#23e5bf]"
                      />
                    </div>
                    <div>
                      <label class="block text-xs font-bold text-gray-200 mb-1">Ціна (в гривнях ₴) *</label>
                      <input
                        type="number"
                        required
                        step="0.01"
                        placeholder="0.00"
                        value={price}
                        onChange={e => setPrice(e.target.value)}
                        class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#23e5bf]"
                      />
                    </div>
                    <div>
                      <label class="block text-xs font-bold text-gray-200 mb-1">Фото товару</label>
                      <input
                        type="file"
                        accept="image/*"
                        onChange={handleFileChange}
                        class="w-full text-xs text-gray-300 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-[#23e5bf] file:text-[#002f34]"
                      />
                      {imagePreview && (
                        <div class="mt-2">
                          <img src={imagePreview} alt="Прев'ю" class="w-full h-32 object-cover rounded-xl border border-[#104b50]" />
                        </div>
                      )}
                    </div>
                    <div>
                      <label class="block text-xs font-bold text-gray-200 mb-1">Категорія</label>
                      <select
                        value={categoryId}
                        onChange={e => setCategoryId(e.target.value)}
                        class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#23e5bf]"
                      >
                        <option value="">Оберіть категорію</option>
                        {categories.map(cat => (
                          <option key={cat.id} value={cat.id}>{cat.title}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label class="block text-xs font-bold text-gray-200 mb-1">Опис товару</label>
                      <textarea
                        rows="3"
                        placeholder="Розкажіть про стан товару..."
                        value={description}
                        onChange={e => setDescription(e.target.value)}
                        class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#23e5bf]"
                      ></textarea>
                    </div>
                    <button
                      type="submit"
                      disabled={isSubmitting}
                      class="w-full bg-[#23e5bf] text-[#002f34] font-black py-3 rounded-xl shadow-md hover:bg-[#1fd6b2] active:scale-[0.99] transition disabled:opacity-50"
                    >
                      {isSubmitting ? 'Публікація...' : 'Опублікувати оголошення'}
                    </button>
                  </form>
                </div>
              </main>
            )}
          </div>

          {/* Bottom Nav */}
          <nav class="fixed bottom-0 left-0 right-0 bg-[#002f34] border-t border-[#104b50] flex justify-around py-2.5 max-w-md mx-auto z-20 shadow-lg">
            <button
              onClick={() => setTab('catalog')}
              class={`flex flex-col items-center text-xs font-bold transition ${tab === 'catalog' ? 'text-[#23e5bf]' : 'text-gray-400'}`}
            >
              <span class="text-base mb-0.5">🔍</span>
              <span>Каталог</span>
            </button>
            <button
              onClick={() => setTab('add')}
              class={`flex flex-col items-center text-xs font-bold transition ${tab === 'add' ? 'text-[#23e5bf]' : 'text-gray-400'}`}
            >
              <span class="text-base mb-0.5">➕</span>
              <span>Подати</span>
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
