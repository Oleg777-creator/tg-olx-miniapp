        setInitializing(true);

      async function ensureDatabaseUser() {

        const {
          data: existingUser,
          error: selectError
        } =
          await supabaseClient
            .from('users')
            .select('*')
            .eq(
              'telegram_id',
              currentUser.id
            )
            .maybeSingle();


        if (selectError) {

          console.error(
            'users SELECT:',
            selectError
          );

          throw new Error(
            'Не вдалося прочитати користувача:\n' +
            getErrorText(selectError)
          );
        }


        if (existingUser?.id) {

          return existingUser;
        }


        const newUserData = {
          telegram_id: currentUser.id,
          username:
            currentUser.username ||
            `user_${currentUser.id}`,
          first_name:
            currentUser.first_name ||
            'Користувач',
          last_name:
            currentUser.last_name ||
            null,
          photo_url:
            currentUser.photo_url ||
            null

          data: insertedUser,
          error: insertError
        } =
          await supabaseClient
            .from('users')
            .insert([newUserData])
            .select('*')
            .single();


        if (insertError) {

          console.error(
            'users INSERT:',
            insertError
          );

          throw new Error(
            'Не вдалося створити профіль:\n' +
            getErrorText(insertError)
          );
        }


        return insertedUser;
      }

            'categories:',
            error

          setCategories([]);

          setCategoriesError(
            getErrorText(error)
          );

          return;
        }


        setCategories(
          Array.isArray(data)

        );
      }


      async function fetchProducts() {

          error

            .from('products')

                id,
                telegram_id,
                username,
                first_name
              ),
              product_images(
                image_url
              )

              { ascending: false }

            getErrorText(error)

          setLoading(false);

          return;
        }

          data || []

        setLoading(false);

          if (!error) {

            setProducts(prev =>

            );

      async function uploadImages() {

        const uploadedUrls = [];


        for (
          const file of imageFiles
        ) {

          const extension =
            (
              file.name
                ?.split('.')
                .pop() ||
              'jpg'
            )
              .toLowerCase()
              .replace(
                /[^a-z0-9]/g,
                ''
              ) ||
            'jpg';


          const fileName =
            `${currentUser.id}/` +
            `${Date.now()}_` +
            `${Math.random()
              .toString(36)
              .slice(2)}.` +
            `${extension}`;


          const {
            error: uploadError
          } =
            await supabaseClient
              .storage
              .from('product-images')
              .upload(
                fileName,
                file,
                {
                  cacheControl:
                    '3600',
                  upsert: false
                }
              );


          if (uploadError) {

            throw new Error(
              'Помилка фото:\n' +
              getErrorText(
                uploadError
              )
            );
          }


          const {
            data: publicData
          } =
            supabaseClient
              .storage
              .from('product-images')
              .getPublicUrl(
                fileName
              );


          if (
            publicData?.publicUrl
          ) {
            uploadedUrls.push(
              publicData.publicUrl
            );
          }
        }


        return uploadedUrls;
      }


      async function handleSaveProduct(event) {

        event.preventDefault();


        if (!currentDbUser?.id) {

          alert(
            userError
              ? 'Не вдалося завантажити профіль:\n\n' +
                userError
              : 'Профіль ще завантажується. Спробуйте через кілька секунд.'
          );

          return;
        }


        if (!title.trim()) {

          alert(
            'Вкажіть назву товару.'
          );

          return;
        }


        const parsedPrice =
          Number(price);


        if (
          !Number.isFinite(
            parsedPrice
          ) ||
          parsedPrice < 0
        ) {

          alert(
            'Вкажіть правильну ціну.'
          );

          return;
        }


        if (!categoryId) {

          alert(
            'Оберіть категорію.'
          );

          return;
        }


        setIsSubmitting(true);


        try {

          const uploadedUrls =
            await uploadImages();


          const finalImages =
            [
              ...existingImageUrls,
              ...uploadedUrls
            ]
              .filter(Boolean)
              .slice(0, 5);


          const mainImage =
            finalImages[0] ||
            null;


          const productPayload = {

            title:
              title.trim(),

            price_uah:
              parsedPrice,

            condition,

            description:
              description.trim(),

            category_id:
              Number(categoryId),

            image_url:
              mainImage

          };


          if (editingProductId) {

            const {
              error: updateError
            } =
              await supabaseClient
                .from('products')
                .update(
                  productPayload
                )
                .eq(
                  'id',
                  editingProductId
                )
                .eq(
                  'user_id',
                  currentDbUser.id
                );


            if (updateError) {

              throw new Error(
                getErrorText(
                  updateError
                )
              );
            }


            const {
              error: deleteImagesError
            } =
              await supabaseClient
                .from('product_images')
                .delete()
                .eq(
                  'product_id',
                  editingProductId
                );


            if (deleteImagesError) {

              throw new Error(
                'Не вдалося оновити галерею:\n' +
                getErrorText(
                  deleteImagesError
                )
              );
            }


            if (
              finalImages.length > 0
            ) {

              const {
                error: imagesInsertError
              } =
                await supabaseClient
                  .from(
                    'product_images'
                  )
                  .insert(
                    finalImages.map(
                      url => ({
                        product_id:
                          editingProductId,
                        image_url:
                          url
                      })
                    )
                  );


              if (
                imagesInsertError
              ) {

                throw new Error(
                  'Не вдалося зберегти фото:\n' +
                  getErrorText(
                    imagesInsertError
                  )
                );
              }
            }


            alert(
              '✅ Оголошення оновлено.'
            );

          } else {

            const {
              data: newProduct,
              error: insertError
            } =
              await supabaseClient
                .from('products')
                .insert([
                  {
                    ...productPayload,
                    user_id:
                      currentDbUser.id
                  }
                ])
                .select('*')
                .single();


            if (insertError) {

              throw new Error(
                getErrorText(
                  insertError
                )
              );
            }


            if (
              !newProduct?.id
            ) {

              throw new Error(
                'Supabase не повернув ID нового оголошення.'
              );
            }


            if (
              finalImages.length > 0
            ) {

              const {
                error: galleryError
              } =
                await supabaseClient
                  .from(
                    'product_images'
                  )
                  .insert(
                    finalImages.map(
                      url => ({
                        product_id:
                          newProduct.id,
                        image_url:
                          url
                      })
                    )
                  );


              if (galleryError) {

                throw new Error(
                  'Оголошення створено, але фото не збережено:\n' +
                  getErrorText(
                    galleryError
                  )
                );
              }
            }


            alert(
              '🎉 Оголошення опубліковано.'
            );
          }


          resetForm();

          await fetchProducts();

          setTab('catalog');


        } catch (error) {

          console.error(
            'SAVE ERROR:',
            error
          );


          alert(
            'Помилка збереження:\n\n' +
            (
              error?.message ||
              String(error)
            )
          );


        } finally {

          setIsSubmitting(false);

        }
      }

        await fetchProducts();

      }


      async function waitForBoost(
        productId,
        attempts = 12
      ) {

        for (
          let i = 0;
          i < attempts;
          i++
        ) {

          const {
            data,
            error
          } =
            await supabaseClient
              .from('products')
              .select(
                'boosted_until'
              )
              .eq(
                'id',
                productId
              )
              .maybeSingle();


          if (
            !error &&
            data?.boosted_until &&
            new Date(
              data.boosted_until
            ) > new Date()
          ) {

            return true;
          }


          await sleep(1500);
        }


        return false;
      }


      async function boostProduct(prod) {

        if (
          !prod?.id ||
          prod.is_sold
        ) {
          return;
        }


        if (!currentDbUser?.id) {

          alert(
            'Профіль користувача ще не завантажений.'
          );

          return;
        }


        setBoostingProductId(
          prod.id
        );


        try {

          const {
            data,
            error
          } =
            await supabaseClient
              .functions
              .invoke(
                'create-telegram-invoice',
                {
                  body: {
                    productId:
                      prod.id,
                    telegramUserId:
                      currentUser.id
                  }
                }
              );


          if (
            error ||
            !data?.invoiceLink
          ) {

            let message =
              data?.error ||
              error?.message ||
              'Не вдалося створити рахунок.';


            try {

              if (
                error?.context
              ) {

                const contextData =
                  await error.context
                    .json();

                if (
                  contextData?.error
                ) {
                  message =
                    contextData.error;
                }
              }

            } catch {}


            alert(
              'Помилка створення рахунку:\n\n' +
              message
            );

            return;
          }


          if (
            window.Telegram
              ?.WebApp
              ?.openInvoice
          ) {

            window.Telegram
              .WebApp
              .openInvoice(
                data.invoiceLink,
                async status => {

                  if (
                    status === 'paid'
                  ) {

                    const activated =
                      await waitForBoost(
                        prod.id
                      );


                    await fetchProducts();


                    if (
                      activated
                    ) {

                      alert(
                        '⭐ TOP активовано на 3 дні!'
                      );

                    } else {

                      alert(
                        '⭐ Оплата пройшла. Telegram підтверджує TOP. Оновіть каталог через кілька секунд.'
                      );
                    }

                  } else if (
                    status ===
                    'cancelled'
                  ) {

                    alert(
                      'Оплату скасовано.'
                    );

                  } else if (
                    status ===
                    'failed'
                  ) {

                    alert(
                      'Оплата не пройшла.'
                    );
                  }
                }
              );

          } else {

            alert(
              'Оплату потрібно відкривати всередині Telegram.'
            );
          }


        } catch (error) {

          console.error(
            'BOOST:',
            error
          );


          alert(

        if (

          alert(
            'Не можна залишити відгук самому собі.'
          );

          return;
        }


        const {
          error
        } =
          await supabaseClient
            .from('reviews')
            .insert([
              {
                seller_id:
                  selectedProduct
                    .users.id,
                reviewer_id:
                  currentDbUser.id,
                rating:
                  Number(
                    newRating
                  ),
                comment:
                  newReviewComment
                    .trim()
              }
            ]);


        if (error) {

          alert(
            'Помилка відгуку:\n' +
            getErrorText(error)
          );

          return;
        }


        setNewReviewComment('');


        const {
          data
        } =
          await supabaseClient
            .from('reviews')
            .select('*')
            .eq(
              'seller_id',
              selectedProduct
                .users.id
            )
            .order(
              'created_at',

      function isTop(prod) {

        return Boolean(

            const searchMatch =
              String(
                prod.title || ''
              )
                .toLowerCase()
                .includes(
                  searchQuery
                    .toLowerCase()
                );


            const minMatch =
              minPrice
                ? Number(
                    prod.price_uah
                  ) >=
                  Number(
                    minPrice
                  )
                : true;


            const maxMatch =
              maxPrice
                ? Number(
                    prod.price_uah
                  ) <=
                  Number(
                    maxPrice
                  )
                : true;


            const conditionMatch =
              conditionFilter ===
              'all'
                ? true
                : prod.condition ===
                  conditionFilter;


            return (
              categoryMatch &&
              searchMatch &&
              minMatch &&
              maxMatch &&
              conditionMatch
            );
          })
          .sort((a, b) => {

            const aTop =
              isTop(a);

            const bTop =
              isTop(b);


            if (
              aTop !== bTop
            ) {
              return aTop
                ? -1
                : 1;

            if (
              sortOption ===

              'price_desc'

              return (

                  b.price_uah

                Number(
                  a.price_uah

              );
            }


            return (
              new Date(
                b.created_at

                                w-6
                                h-6
                                rounded-full
                                font-black
                              "
                            >
                              ×
                            </button>

                          </div>

                        )
                      )}


                      {imagePreviews.map(
                        (src, index) => (

                          <div
                            key={
                              'new-' +
                              index
                            }
                            className="
                              relative
                              flex-shrink-0
                              w-24
                              h-28
                              bg-gray-900
                              rounded-xl
                              overflow-hidden
                            "
                          >

                            <img
                              src={src}
                              alt=""
                              className="
                                w-full
                                h-full
                                object-contain
                              "
                            />

                            <button
                              type="button"
                              onClick={() =>
                                removeNewImage(
                                  index
                                )
                              }
                              className="
                                absolute
                                top-1
                                right-1
                                bg-red-600
                                w-6
                                h-6
                                rounded-full
                                font-black
                              "
                            >
                              ×
                            </button>

                          </div>

                        )
                      )}


                      {
                        existingImageUrls.length +
                        imageFiles.length <
                        5 && (

                        <label
                          className="
                            flex-shrink-0
                            w-24
                            h-28
                            border-2
                            border-dashed
                            border-[#23e5bf]
                            bg-[#00474e]
                            rounded-xl
                            flex
                            flex-col
                            items-center
                            justify-center
                          "
                        >

                          <span
                            className="
                              text-3xl
                              text-[#23e5bf]
                            "
                          >
                            +
                          </span>

                          <span
                            className="
                              text-xs
                              font-bold
                            "
                          >
                            Додати
                          </span>

                          <input
                            type="file"
                            accept="image/*"
                            multiple
                            onChange={
                              handleFilesAdd
                            }
                            className="hidden"
                          />

                        </label>

                      )}

                    </div>

                  </div>


                  <div>

                    <label
                      className="
                        block
                        text-xs
                        font-bold
                        mb-1
                      "
                    >
                      Опис
                    </label>

                    <textarea
                      rows="4"
                      value={description}
                      onChange={event =>
                        setDescription(
                          event.target.value
                        )
                      }
                      placeholder="Детальний опис товару..."
                      className="
                        w-full
                        rounded-xl
                        p-3
                      "
                    />

                  </div>


                  <button
                    type="submit"
                    disabled={
                      isSubmitting ||
                      initializing ||
                      !currentDbUser?.id
                    }
                    className="
                      w-full
                      bg-[#23e5bf]
                      text-[#002f34]
                      font-black
                      rounded-xl
                      py-4
                      disabled:opacity-40
                    "
                  >
                    {
                      isSubmitting
                        ? 'Збереження...'
                        : editingProductId
                          ? 'Зберегти зміни'
                          : 'Опублікувати'
                    }
                  </button>

                </form>

              </div>

            </main>

          )}


          {tab === 'profile' && (

            <main className="p-4">

              <div
                className="
                  bg-[#00383e]
                  border
                  border-[#104b50]
                  rounded-2xl
                  p-4
                  mb-4
                "
              >

                <h2
                  className="
                    font-black
                    text-lg
                  "
                >
                  👤 Особистий кабінет
                </h2>

                <p
                  className="
                    text-xs
                    text-gray-300
                    mt-1
                  "
                >
                  Ваших оголошень: {
                    myProducts.length
                  }
                </p>

              </div>


              {myProducts.length ===
              0 ? (

                <div
                  className="
                    bg-[#00383e]
                    border
                    border-[#104b50]
                    rounded-xl
                    p-8
                    text-center
                    text-gray-300
                  "
                >
                  У вас ще немає оголошень
                </div>

              ) : (

                <div className="space-y-3">

                  {myProducts.map(
                    prod => (

                      <div
                        key={prod.id}
                        className="
                          bg-white
                          text-[#002f34]
                          rounded-xl
                          p-3
                          shadow
                        "
                      >

                        <div
                          className="
                            flex
                            gap-3
                            items-center
                          "
                        >

                          {prod.image_url ? (

                            <img
                              src={
                                prod.image_url
                              }
                              alt=""
                              className="
                                w-16
                                h-16
                                object-cover
                                rounded-lg
                              "
                            />

                          ) : (

                            <div
                              className="
                                w-16
                                h-16
                                bg-gray-100
                                rounded-lg
                                flex
                                items-center
                                justify-center
                              "
                            >
                              🖼️
                            </div>

                          )}


                          <div
                            className="
                              flex-1
                              min-w-0
                            "
                          >

                            <h3
                              className="
                                font-black
                                text-sm
                                truncate
                              "
                            >
                              {prod.title}
                            </h3>

                            <div
                              className="
                                font-black
                                mt-1
                              "
                            >
                              {prod.price_uah} ₴
                            </div>

                            <div
                              className="
                                text-xs
                                text-gray-500
                              "
                            >
                              👁️ {
                                prod.views_count ||
                                0
                              }
                            </div>

                          </div>

                        </div>


                        {isTop(prod) && (

                          <div
                            className="
                              mt-2
                              text-xs
                              bg-amber-100
                              text-amber-900
                              font-black
                              rounded-lg
                              p-2
                            "
                          >
                            ⭐ TOP активний до {
                              new Date(
                                prod.boosted_until
                              )
                                .toLocaleString(
                                  'uk-UA'
                                )
                            }
                          </div>

                        )}


                        <div
                          className="
                            grid
                            grid-cols-2
                            gap-2
                            mt-3
                          "
                        >

                          <button
                            type="button"
                            onClick={() =>
                              startEditing(
                                prod
                              )
                            }
                            className="
                              bg-blue-100
                              text-blue-700
                              font-bold
                              rounded-lg
                              py-2
                              text-xs
                            "
                          >
                            ✏️ Редагувати
                          </button>


                          <button
                            type="button"
                            onClick={() =>
                              toggleSoldStatus(
                                prod
                              )
                            }
                            className="
                              bg-green-100
                              text-green-800
                              font-bold
                              rounded-lg
                              py-2
                              text-xs
                            "
                          >
                            {
                              prod.is_sold
                                ? 'Повернути в продаж'
                                : '✅ Продано'
                            }
                          </button>


                          <button
                            type="button"
                            onClick={() =>
                              boostProduct(
                                prod
                              )
                            }
                            disabled={
                              prod.is_sold ||
                              boostingProductId ===
                                prod.id
                            }
                            className="
                              bg-amber-100
                              text-amber-900
                              font-black
                              rounded-lg
                              py-2
                              text-xs
                              disabled:opacity-40
                            "
                          >
                            {
                              boostingProductId ===
                              prod.id
                                ? '⏳ Зачекайте...'
                                : '⭐ TOP — 50 ⭐'
                            }
                          </button>


                          <button
                            type="button"
                            onClick={() =>
                              handleDeleteProduct(
                                prod
                              )
                            }
                            className="
                              bg-red-100
                              text-red-700
                              font-bold
                              rounded-lg
                              py-2
                              text-xs
                            "
                          >
                            🗑️ Видалити
                          </button>

                        </div>

                      </div>

                    )
                  )}

                </div>

              )}

            </main>

          )}


          {selectedProduct && (

            <div
              className="
                fixed
                inset-0
                bg-black/80
                z-50
                flex
                items-end
                justify-center
              "
            >

              <div
                className="
                  bg-white
                  text-[#002f34]
                  w-full
                  max-w-md
                  max-h-[92vh]
                  overflow-y-auto
                  rounded-t-3xl
                  p-5
                  relative
                "
              >

                <button
                  type="button"
                  onClick={() =>
                    setSelectedProduct(
                      null
                    )
                  }
                  className="
                    absolute
                    top-4
                    right-4
                    z-20
                    bg-gray-200
                    rounded-full
                    w-9
                    h-9
                    font-black
                  "
                >
                  ×
                </button>


                {
                  selectedProduct
                    .product_images
                    ?.length > 0
                    ? (

                  <div
                    className="
                      flex
                      overflow-x-auto
                      no-scrollbar
                      snap-x
                      rounded-2xl
                      bg-gray-900
                      h-80
                      mb-4
                    "
                  >

                    {
                      selectedProduct
                        .product_images
                        .map(
                          (
                            image,
                            index
                          ) => (

                        <div
                          key={index}
                          className="
                            flex-shrink-0
                            w-full
                            h-full
                            snap-center
                            flex
                            items-center
                            justify-center
                          "
                        >

                          <img
                            src={
                              image.image_url
                            }
                            alt=""
                            className="
                              max-w-full
                              max-h-full
                              object-contain
                            "
                          />

                        </div>

                      ))
                    }

                  </div>

                ) : selectedProduct
                    .image_url ? (

                  <div
                    className="
                      h-80
                      bg-gray-900
                      rounded-2xl
                      mb-4
                      flex
                      items-center
                      justify-center
                    "
                  >

                    <img
                      src={
                        selectedProduct
                          .image_url
                      }
                      alt=""
                      className="
                        max-w-full
                        max-h-full
                        object-contain
                      "
                    />

                  </div>

                ) : (

                  <div
                    className="
                      h-48
                      bg-gray-100
                      rounded-2xl
                      mb-4
                      flex
                      items-center
                      justify-center
                      text-4xl
                    "
                  >
                    🖼️
                  </div>

                )}


                {isTop(
                  selectedProduct
                ) && (

                  <span
                    className="
                      inline-block
                      bg-amber-300
                      font-black
                      text-xs
                      rounded
                      px-2
                      py-1
                      mb-2
                    "
                  >
                    ⭐ TOP
                  </span>

                )}


                <div
                  className="
                    flex
                    gap-2
                    text-xs
                    mb-2
                  "
                >

                  <span
                    className="
                      bg-[#23e5bf]
                      font-black
                      px-2
                      py-1
                      rounded
                    "
                  >
                    {
                      selectedProduct
                        .categories
                        ?.title ||
                      'Товар'
                    }
                  </span>

                  <span
                    className="
                      text-gray-500
                      font-bold
                      py-1
                    "
                  >
                    {
                      selectedProduct
                        .condition ===
                      'new'
                        ? '✨ Новий'
                        : '👌 Вживаний'
                    }
                  </span>

                </div>


                <h2
                  className="
                    text-xl
                    font-black
                  "
                >
                  {
                    selectedProduct.title
                  }
                </h2>


                <div
                  className="
                    text-2xl
                    font-black
                    my-2
                  "
                >
                  {
                    selectedProduct
                      .price_uah
                  } ₴
                </div>


                {selectedProduct
                  .description && (

                  <div
                    className="
                      border-t
                      mt-4
                      pt-4
                    "
                  >

                    <h3
                      className="
                        text-xs
                        uppercase
                        text-gray-500
                        font-bold
                        mb-1
                      "
                    >
                      Опис
                    </h3>

                    <p
                      className="
                        text-sm
                        whitespace-pre-line
                      "
                    >
                      {
                        selectedProduct
                          .description
                      }
                    </p>

                  </div>

                )}


                <div
                  className="
                    border-t
                    mt-4
                    pt-4
                  "
                >

                  <div
                    className="
                      flex
                      justify-between
                      mb-3
                    "
                  >

                    <b className="text-xs">
                      Рейтинг продавця
                    </b>

                    <b
                      className="
                        text-xs
                        text-amber-500
                      "
                    >
                      ⭐ {
                        avgRating ||
                        'Немає оцінок'
                      }
                    </b>

                  </div>


                  {
                    selectedProduct
                      .users?.id !==
                    currentDbUser?.id && (

                    <form
                      onSubmit={
                        handleAddReview
                      }
                      className="
                        bg-gray-100
                        rounded-xl
                        p-3
                        space-y-2
                      "
                    >

                      <select
                        value={newRating}
                        onChange={event =>
                          setNewRating(
                            event.target.value
                          )
                        }
                        className="
                          w-full
                          rounded-lg
                          p-2
                          text-xs
                        "
                      >
                        <option value="5">
                          ⭐⭐⭐⭐⭐ 5
                        </option>

                        <option value="4">
                          ⭐⭐⭐⭐ 4
                        </option>

                        <option value="3">
                          ⭐⭐⭐ 3
                        </option>

                        <option value="2">
                          ⭐⭐ 2
                        </option>

                        <option value="1">
                          ⭐ 1
                        </option>
                      </select>


                      <input
                        type="text"
                        placeholder="Ваш відгук..."
                        value={
                          newReviewComment
                        }
                        onChange={event =>
                          setNewReviewComment(
                            event.target.value
                          )
                        }
                        className="
                          w-full
                          rounded-lg
                          p-2
                          text-xs
                        "
                      />


                      <button
                        type="submit"
                        className="
                          w-full
                          bg-[#002f34]
                          text-white
                          py-2
                          rounded-lg
                          font-bold
                          text-xs
                        "
                      >
                        Залишити відгук
                      </button>

                    </form>

                  )}


                  <div
                    className="
                      space-y-2
                      mt-3
                    "
                  >

                    {sellerReviews.map(
                      review => (

                        <div
                          key={review.id}
                          className="
                            bg-gray-50
                            rounded-lg
                            p-2
                            text-xs
                          "
                        >

                          <b
                            className="
                              text-amber-500
                            "
                          >
                            {
                              '⭐'.repeat(
                                Number(
                                  review.rating ||
                                  0
                                )
                              )
                            }
                          </b>

                          {review.comment && (

                            <p className="mt-1">
                              {review.comment}
                            </p>

                          )}

                        </div>

                      )
                    )}

                  </div>

                </div>


                <div
                  className="
                    flex
                    gap-2
                    mt-5
                  "
                >

                  <button
                    type="button"
                    onClick={() =>
                      openSellerChat(
                        selectedProduct
                          .users
                          ?.username
                      )
                    }
                    className="
                      flex-1
                      bg-[#002f34]
                      text-[#23e5bf]
                      font-black
                      py-3
                      rounded-xl
                    "
                  >
                    💬 Написати
                  </button>


                  <button
                    type="button"
                    onClick={event =>
                      toggleFavorite(
                        selectedProduct,
                        event
                      )
                    }
                    className="
                      bg-gray-100
                      px-4
                      rounded-xl
                    "
                  >
                    {
                      favoriteIds.includes(
                        selectedProduct.id
                      )
                        ? '❤️'
                        : '🤍'
                    }
                  </button>


                  <button
                    type="button"
                    onClick={() =>
                      shareProduct(
                        selectedProduct
                      )
                    }
                    className="
                      bg-gray-100
                      px-4
                      rounded-xl
                    "
                  >
                    🔗
                  </button>

                </div>

              </div>

            </div>

          )}


          <nav
            className="
              fixed
              bottom-0
              left-0
              right-0
              max-w-md
              mx-auto
              bg-[#002f34]
              border-t
              border-[#104b50]
              flex
              justify-around
              py-3
              z-30
            "
          >

            <button
              type="button"
              onClick={() =>
                setTab('catalog')
              }
              className={
                `flex flex-col items-center ` +
                `text-xs font-bold ` +
                (
                  tab === 'catalog'
                    ? 'text-[#23e5bf]'
                    : 'text-gray-400'
                )
              }
            >
              <span className="text-xl">
                🔍
              </span>
              Каталог
            </button>


            <button
              type="button"
              onClick={() =>
                setTab('favorites')
              }
              className={
                `flex flex-col items-center ` +
                `text-xs font-bold ` +
                (
                  tab ===
                  'favorites'
                    ? 'text-[#23e5bf]'
                    : 'text-gray-400'
                )
              }
            >
              <span className="text-xl">
                ❤️
              </span>
              Обране
            </button>


            <button
              type="button"
              onClick={() => {
                resetForm();
                setTab('add');
              }}
              className={
                `flex flex-col items-center ` +
                `text-xs font-bold ` +
                (
                  tab === 'add'
                    ? 'text-[#23e5bf]'
                    : 'text-gray-400'
                )
              }
            >
              <span className="text-xl">
                ➕
              </span>
              Подати
            </button>


            <button
              type="button"
              onClick={() =>
                setTab('profile')
              }
              className={
                `flex flex-col items-center ` +
                `text-xs font-bold ` +
                (
                  tab === 'profile'
                    ? 'text-[#23e5bf]'
                    : 'text-gray-400'
                )
              }
            >
              <span className="text-xl">
                👤
              </span>
              Профіль
            </button>

          </nav>

        </div>
      );
    }


    ReactDOM
      .createRoot(
        document.getElementById(
          'root'
        )
      )
      .render(
        <App />
      );

  </script>
</body>
</html>
